}

// Outra aba ou aparelho salvou depois desta: pausa os envios e pergunta
function escutarNuvem() {
  if (Nuvem.cancelar || !Nuvem.ref) return;
  Nuvem.cancelar = Nuvem.ref.onSnapshot((snap) => {
    if (!snap.exists || snap.metadata.hasPendingWrites || !STATE) return;
    const d = snap.data() || {};
    if (!d.sessao || d.sessao === Nuvem.sessao || (+d.ultimaVez || 0) <= Nuvem.ultimaNuvem) return;
    Nuvem.ultimaNuvem = +d.ultimaVez || 0;
    Nuvem.pausada = true;
    Nuvem.avisoDepois = snap;
    if (!lutaRolando()) mostrarAvisoOutroAparelho();
  }, () => { Nuvem.cancelar = null; });
}
function mostrarAvisoOutroAparelho() {
  const snap = Nuvem.avisoDepois; Nuvem.avisoDepois = null;
  const remoto = docParaSave(snap); if (!remoto) { Nuvem.pausada = false; return; }
  Nuvem.pendente = remoto;
  if (modalCom('nuvem')) return;
  abrirModal(`<h2>Jogo salvo em outro lugar</h2>
    <p class="dica">Seu progresso foi salvo em outro aparelho ou aba depois desta. Para não perder nada, escolha com qual continuar.</p>
    <div class="lista">${cartaoSave('O mais recente (outro aparelho)', resumoSave(remoto.st), remoto.ultimaVez, 'nuvem-usar-conta')}${cartaoSave('Esta aba', resumoSave(STATE), STATE.ultimaVez, 'nuvem-usar-aparelho')}</div>`, { semFechar: true, dados: { nuvem: true } });
}

// Envio: logo depois de ações (com folga de 8 s) e, no ócio, no máximo a cada 90 s
function marcarNuvem(importante) { if (Nuvem.estado === 'ativa') Nuvem.sujo = Math.max(Nuvem.sujo, importante ? 2 : 1); }
function cicloNuvem() {
  if (Nuvem.avisoDepois && !lutaRolando()) mostrarAvisoOutroAparelho();
  if (Nuvem.estado !== 'ativa' || Nuvem.pausada || Nuvem.enviando || !STATE || !Nuvem.sujo) return;
  const desde = Date.now() - Nuvem.ultimoEnvio;
  if ((Nuvem.sujo >= 2 && desde >= 8000) || desde >= 90000) enviarNuvem();
}
async function enviarNuvem(forcar = false) {
  if (Nuvem.estado !== 'ativa' || !STATE || Nuvem.enviando || (Nuvem.pausada && !forcar)) return false;
  const texto = JSON.stringify(STATE);
  if (texto === Nuvem.ultimoTexto) { Nuvem.sujo = 0; return true; }
  if (texto.length > TAM_MAX_NUVEM) { Nuvem.erro = 'grande'; Nuvem.sujo = 0; atualizarStatusNuvem(); return false; }
  const sujoAntes = Nuvem.sujo;
  Nuvem.enviando = true; Nuvem.sujo = 0;
  try {
    await Nuvem.ref.set({ v: 1, save: texto, ultimaVez: STATE.ultimaVez, criadoEm: STATE.criadoEm, sessao: Nuvem.sessao, resumo: resumoSave(STATE) });
    Nuvem.ultimoTexto = texto; Nuvem.ultimoEnvio = Date.now(); Nuvem.ultimaNuvem = STATE.ultimaVez; Nuvem.erro = ''; Nuvem.pausada = false;
    return true;
  } catch (e) {
    const code = (e && e.code) || 'unavailable';
    if (code === 'invalid_argument') Nuvem.estado = 'sem-permissao';
    else if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(code)) Nuvem.estado = 'local';
    else { Nuvem.sujo = Math.max(Nuvem.sujo, sujoAntes || 1); Nuvem.ultimoEnvio = Date.now(); Nuvem.erro = code; }   // tenta de novo mais tarde
    return false;
  } finally {
    Nuvem.enviando = false;
    if (Nuvem.estado !== 'ativa' && Nuvem.cancelar) { Nuvem.cancelar(); Nuvem.cancelar = null; }
    atualizarStatusNuvem();
  }
}
function apagarNuvem() {
  if (Nuvem.estado !== 'ativa' || !Nuvem.ref) return;
  Nuvem.ultimoTexto = ''; Nuvem.sujo = 0;
  Nuvem.ref.delete().catch(() => { /* fica para o próximo envio sobrescrever */ });
}

function textoStatusNuvem() {
  switch (Nuvem.estado) {
    case 'ativa': {
      const min = Nuvem.ultimoEnvio ? Math.floor((Date.now() - Nuvem.ultimoEnvio) / 60000) : null;
      const quando = min === null ? 'aguardando a primeira cópia' : min < 1 ? 'última cópia agora há pouco' : `última cópia há ${min} min`;
      return `Salvo neste aparelho e na sua conta Claude (${quando}). Você pode continuar em outro aparelho entrando com a mesma conta.${Nuvem.erro === 'grande' ? ' O save ficou grande demais para a conta: use Exportar save.' : ''}`;
    }
    case 'conectando': return 'Salvo neste aparelho. Conectando à sua conta Claude…';
    case 'sem-permissao': return 'Salvo neste aparelho. Este link não permite guardar o progresso na sua conta, então exporte o código de vez em quando para não perder.';
    default: return 'O jogo salva sozinho neste aparelho. Exporte o código para guardar uma cópia ou continuar em outro lugar.';
  }
}
function atualizarStatusNuvem() {
  const el = document.getElementById('status-nuvem'); if (el) el.textContent = textoStatusNuvem();

/* ---- canvases de pixel no DOM ---- */
const PROP_RETRATO = RETRATO.h / RETRATO.w;
// Na interface os personagens ficam de frente (vista 'frente'); use data-vista="lado" para o perfil clássico.
const canvasLook = (look, w, extra = '') => `<canvas class="px" data-look="${look}" ${/data-vista/.test(extra) ? '' : 'data-vista="frente"'} width="${RETRATO.w}" height="${RETRATO.h}" style="width:${w}px;height:${Math.round(w * PROP_RETRATO)}px" ${extra} aria-hidden="true"></canvas>`;
const canvasBrasao = (b, tam) => `<canvas class="px" data-brasao="${b.cor1}|${b.cor2}|${b.simbolo}" width="14" height="14" style="width:${tam}px;height:${tam}px" aria-hidden="true"></canvas>`;
const canvasIcone = (nome, tam, cores) => `<canvas class="px" data-icone="${nome}"${cores ? ` data-cores='${JSON.stringify(cores)}'` : ''} width="12" height="12" style="width:${tam}px;height:${tam}px" aria-hidden="true"></canvas>`;
function desenharEm(cv, src) {
  if (cv.width !== src.width) cv.width = src.width;
  if (cv.height !== src.height) cv.height = src.height;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.clearRect(0, 0, cv.width, cv.height); c.drawImage(src, 0, 0);
}
function hidratar(raiz = document) {
  $$('canvas[data-look]', raiz).forEach((cv) => desenharEm(cv, retrato(cv.dataset.look, 0, cv.dataset.vista || 'lado')));
  $$('canvas[data-brasao]', raiz).forEach((cv) => { const [cor1, cor2, simbolo] = cv.dataset.brasao.split('|'); desenharEm(cv, brasaoCanvas({ cor1, cor2, simbolo })); });
  $$('canvas[data-icone]', raiz).forEach((cv) => {
    const src = iconeCanvas(cv.dataset.icone, cv.dataset.cores ? JSON.parse(cv.dataset.cores) : null);
    desenharEm(cv, src);
    const w = parseFloat(cv.style.width); if (src.width !== src.height) cv.style.height = `${Math.round(w * src.height / src.width)}px`;
  });
}
// Respiração dos personagens na interface (4 quadros de "idle", fora de fase entre si)
let frameAnim = 0;
function animarSprites() {
  frameAnim = (frameAnim + 1) % QUADROS_POR_ANIM.idle;
  $$('canvas[data-look]:not([data-parado])').forEach((cv, i) => desenharEm(cv, retrato(cv.dataset.look, (frameAnim + i) % QUADROS_POR_ANIM.idle, cv.dataset.vista || 'lado')));
}

/* ---- toasts e modais ---- */

function abrirModal(html, opts = {}) {

  wrap.dados = opts.dados || {};

function removerModal(w) { UI.modais.splice(UI.modais.indexOf(w), 1); w.remove(); if (!UI.modais.length) document.body.classList.remove('com-modal'); }
// Redesenha os modais abertos que mostram dados vivos (ficha, forja, item, criador…)
function atualizarModais() {
  for (const w of [...UI.modais]) {
    const d = w.dados;

    else if (d.item) { const a = acharItem(d.item); if (!a) removerModal(w); else atualizarModal(w, htmlItem(a)); }
    else if (d.consumivel) atualizarModal(w, htmlConsumivel(d.consumivel));

// Resumo do que as relíquias equipadas dão ao time
const REL_TXT = { atqPct: 'ATQ', defPct: 'DEF', agiPct: 'AGI', vidaPct: 'VIDA', crit: 'crítico', roubo: 'roubo de vida', recarga: 'recarga', ouro: 'ouro', xp: 'XP', ocio: 'ócio' };
const FLAG_TXT = { brasaRel: 'ataques queimam', estandarte: 'escudo inicial', fenix: 'Fênix' };
function resumoReliquias() {
  const partes = [];
  for (const k in REL_TXT) { const v = somaReliquia(k); if (v) partes.push(`${k === 'recarga' ? '−' : v > 0 ? '+' : '−'}${fmt1(Math.abs(v) * 100)}% ${REL_TXT[k]}`); }

  if (sorte) partes.push(`+${sorte} Sorte`);
  if (off) partes.push(`+${off} h offline`);
  for (const f of flagsReliquias()) partes.push(FLAG_TXT[f] || f);
  return partes.join(' · ');
}

/* ============================ INTERFACE: BATALHA ============================ */
function iniciarLuta(ctx) {
  ajustarTime();
  if (timeMercs().length < tamanhoTime()) { toast(`Monte um time com ${tamanhoTime()} mercenários no Elenco.`, 'erro'); UI.aba = 'elenco'; render(); return; }
  const preparo = preparoAtivo();
  ctx.usados = consumirPreparo();
  // E4 (e): a partida é uma série de rodadas (melhor de N, por tipo de luta). Consumíveis valem para a partida inteira.
  ctx.serie = { id: Date.now(), max: rodadasDe(ctx.tipo), meta: metaDe(ctx.tipo), rodada: 0, placar: [0, 0], rodadas: [], preparo };
  salvar();
  iniciarRodada(ctx);
}
function iniciarRodada(ctx) {

  else { A = ladoJogador(S.preparo); B = ladoDeGuilda(ctx.rival, multAdversario()); }
  const seed = (Math.random() * 1e9) | 0, optsLuta = { modoAuto: STATE.config.auto, ...opts };
  const reg = prepararRegistro(A, B, optsLuta, seed);   // retrato dos lados antes da luta, para o registro
  const b = criarBatalha(A, B, { ...optsLuta, seed });
  Luta = { b, ctx, reg, vel: STATE.config.vel, pausado: false, rodando: false, acc: 0, ultimo: 0, fimT: 0, terminou: false, raf: 0, ativo: true };
  montarTelaLuta(b);
  $('#luta').hidden = false; $('#app').hidden = true; $('#abas').hidden = true; $('#tutorial').hidden = true;
  window.scrollTo(0, 0);
  const cv = $('#arena');
  prepararArena(cv, b, cenarioDaLuta(ctx));
  Arena.aoSupremo = (u) => mostrarBanner('SUPREMO!', `${u.nome} · ${nomeHabilidade(u.skill.id)}`);
  Arena.aoEvento = eventoNaTela;
  cv.addEventListener('pointerdown', tocarArena);
  Luta.raf = requestAnimationFrame(loopLuta);
  contagem(S.max > 1 ? [`Luta ${S.rodada}`, '3', '2', '1', 'Lute!'] : ['3', '2', '1', 'Lute!'], () => {
    Luta.rodando = true;
    musicaIniciar();
    const md = ctx.tipo === 'torre' ? modDoAndar(ctx.rival.andar) : null;
    if (S.rodada > 1) mostrarBanner(`Luta ${S.rodada}`, `${S.placar[0]} × ${S.placar[1]} · vence quem fizer ${S.meta}`);
    else if (ctx.rival.lider) { const Ld = LIDERES.find((l) => l.id === ctx.rival.lider); mostrarBanner(Ld.nome, Ld.desc); }
    else if (ctx.rival.guardiao) mostrarBanner(ctx.rival.mercs[0].nome, md ? `Guardião da Torre · ${md.nome}` : 'Guardião da Torre');
    else if (md) mostrarBanner(md.nome, md.desc);
    else if (ctx.usados.length) mostrarBanner('Preparo', ctx.usados.map((c) => CONSUMIVEIS[c].nome).join(' · '));
    else if (S.max > 1) mostrarBanner(`Melhor de ${S.max}`, `vence quem ganhar ${S.meta} lutas`);
  });
}

function loopLuta(ts) {
  if (!Luta || !Luta.ativo) return;
  const dt = Math.min(0.1, Luta.ultimo ? (ts - Luta.ultimo) / 1000 : 0);
  Luta.ultimo = ts;
  const b = Luta.b;
  if (Luta.rodando && !Luta.pausado) {
    if (!b.fim) {
      if (Arena.pausa > 0) Arena.pausa -= dt;
      else {
        Luta.acc += dt * Luta.vel;
        let n = 0;
        while (Luta.acc >= DT && n < 12) { passo(b); processarEventos(b); Luta.acc -= DT; n++; if (b.fim) break; }
      }
    } else {
      Luta.fimT += dt;
      if (Luta.fimT > (Arena.lentaTotal ? 1.3 + Arena.lentaTotal : 1.3) && !Luta.terminou) { Luta.terminou = true; finalizarLuta(); }
    }
    const lenta = Arena.lenta > 0;
    if (lenta) Arena.lenta -= dt;
    atualizarVfx(dt * Math.min(Luta.vel, 2) * (lenta ? 0.3 : 1));
  }
  desenharArena();
  atualizarHud();

}

// Fim de uma rodada: registra a luta; se a partida não acabou, abre o intervalo; se acabou, fecha a partida
function finalizarLuta() {
  const b = Luta.b, ctx = Luta.ctx, S = ctx.serie;
  const res = resumoBatalha(b);
  const vit = res.vencedor === 0;
  S.placar[vit ? 0 : 1]++;
  if (b.criador) S.placar[0] = S.meta;   // "Vencer agora" encerra a partida inteira
  STATE.stats.rodadas++;
  const mvp = registrarEstatisticas(b, res, vit);
  registrarPartida(b, res, ctx, vit, mvp, Luta.reg);
  S.rodadas.push({ vit, res, mvp, tempo: res.tempo, abates: res.abates });
  musicaParar();
  if (S.placar[0] < S.meta && S.placar[1] < S.meta) { salvar(); mostrarIntervalo(ctx); return; }
  finalizarPartida(ctx);
}
// Fim da partida: recompensas, liga/copa/torre, resultado
function finalizarPartida(ctx) {
  const S = ctx.serie, b = Luta.b;
  const vit = S.placar[0] >= S.meta;
  const meus = somarRodadas(S.rodadas), ultimo = S.rodadas[S.rodadas.length - 1];
  const res = { vencedor: vit ? 0 : 1, tempo: S.rodadas.reduce((t, r) => t + r.tempo, 0), unidades: [meus, ultimo.res.unidades[1]], abates: S.rodadas.reduce((a, r) => [a[0] + r.abates[0], a[1] + r.abates[1]], [0, 0]) };
  const nivelRival = ctx.rival.mercs.reduce((s, m) => s + m.nivel, 0) / ctx.rival.mercs.length;
  const fator = ctx.tipo === 'amistoso' ? ECO.amistosoRec : ctx.tipo === 'copa' ? 1.5 : ctx.tipo === 'torre' ? (vit ? 1 : 0.5) : 1;
  const xp = Math.round((ECO.xpBase + ECO.xpPorNivel * nivelRival) * (vit ? 1 : ECO.xpDerrota) * fator);
  const ouro = ctx.tipo === 'torre' ? 0 : Math.round((ECO.ouroBase + ECO.ouroPorNivel * nivelRival) * (vit ? 1 : ECO.ouroDerrota) * fator * DIFICULDADES[STATE.config.dif].rec * (1 + somaReliquia('ouro')));
  ganharOuro(ouro);
  const subidas = [];
  for (const u of meus) { const m = u.merc && mercPorId(u.merc.id); if (!m) continue; const s = darXp(m, xp); if (s) subidas.push(s); }
  const nv = Math.max(1, Math.round(nivelMedioTime()));
  let drop = null, copa = null, torre = null;
  STATE.stats.lutas++; if (vit) STATE.stats.vitorias++;
  if (tutorialAtivo() && STATE.tutorial < TUT_FIM) STATE.tutorial++;   // cada luta do tutorial libera um menu
  registrarRastro(ctx, vit);
  const mvp = mvpDe(meus);   // MVP da partida: soma das rodadas
  if (ctx.tipo === 'torre') {
    torre = registrarAndar(vit);
    if (torre.bau >= 0) drop = darDrop(rolarRaridade(sorteGuilda(), torre.bau), nv);
  } else if (ctx.tipo === 'liga') {
    registrarRodada(vit, res.abates[0], res.abates[1]);
    if (vit && Math.random() < ECO.chanceBau) drop = darDrop(rolarRaridade(sorteGuilda()), nv);
  } else if (ctx.tipo === 'copa') {
    copa = registrarCopa(vit);
    if (copa.bauMin >= 0) drop = darDrop(rolarRaridade(sorteGuilda(), copa.bauMin), nv);
  } else {
    STATE.amistoso = null;
    if (vit && Math.random() < ECO.chanceBau * fator) drop = darDrop(rolarRaridade(sorteGuilda()), nv);
  }
  STATE.taverna.lutas++;
  let renovou = false;
  if (STATE.taverna.lutas >= ECO.lutasRenovar) { renovarTaverna(false); renovou = true; }
  salvar();
  musicaParar();
  mostrarResultado({ vit, res, xp, ouro, subidas, drop, ctx, renovou, copa, torre, mvp, serie: S });
}

function abrirCriador() { abrirModal(htmlCriador(), { dados: { criador: true } }); }
const lerNum = (id, padrao = 0) => { const v = Math.floor(Number(($('#' + id) || {}).value)); return Number.isFinite(v) ? v : padrao; };
function acaoCriador(el) {
  const op = el.dataset.op, v = el.dataset.v, U = UI.criador, C = STATE.criador;
  const m = mercPorId(U.merc);
  let msg = '';
  switch (op) {
    case 'ouro': STATE.ouro += +v; msg = `+${fmt(+v)} ouro`; break;
    case 'emb': STATE.emblemas += +v; msg = `+${v} emblemas`; break;
    case 'ouro-def': STATE.ouro = Math.max(0, lerNum('cri-ouro', STATE.ouro)); msg = 'Ouro definido'; break;
    case 'emb-def': STATE.emblemas = Math.max(0, lerNum('cri-emb', STATE.emblemas)); msg = 'Emblemas definidos'; break;
    case 'sorte': C.sorteMult = +v; msg = `Sorte ×${v}`; break;
    case 'tempo': C.tempoMult = +v; msg = `Ócio ×${v}`; break;
    case 'avancar': {
      const r = aplicarTempo(+v);
      for (const e of STATE.expedicoes) { e.fim -= +v * 60000; e.inicio -= +v * 60000; }
      STATE.sabedoriaAte = Math.max(0, (STATE.sabedoriaAte || 0) - +v * 60000);
      msg = `+${fmt(r.ouro)} ouro no cofre e +${fmt(r.xp)} XP`; break;
    }
    case 'expedicoes': for (const e of STATE.expedicoes) e.fim = Math.min(e.fim, Date.now()); msg = 'Expedições prontas'; break;
    case 'merc-aplicar': {
      if (!m) return;
      m.ascensoes = clamp(lerNum('cri-asc', m.ascensoes), 0, 2);
      m.nivel = clamp(lerNum('cri-nivel', m.nivel), 1, NIVEL_TETO);
      if (m.nivel > nivelMax(m)) m.ascensoes = ascPorNivel(m.nivel);
      m.xp = 0;
      m.bonusCriador = { vida: lerNum('cri-b-vida'), atq: lerNum('cri-b-atq'), def: lerNum('cri-b-def'), agi: lerNum('cri-b-agi') };
      while (m.pergaminhos.length > slotsPergaminho(m)) devolverAoInventario(m.pergaminhos.pop());
      msg = `${m.nome} atualizado`; break;
    }
    case 'pot': if (m) { m.pot = v; m.cresc = rolarCresc(m.classe, v); msg = `Potencial ${v}`; } break;
    case 'traco': if (m) { m.tracos = m.tracos.includes(v) ? m.tracos.filter((t) => t !== v) : [...m.tracos, v]; } break;
    case 'it-tipo': U.tipo = v; U.unico = null; break;
    case 'it-rar': U.raridade = +v; break;
    case 'it-unico': U.unico = v || null; break;
    case 'it-criar': {
      if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; }
      U.nivel = clamp(lerNum('cri-it-nivel', U.nivel), 1, NIVEL_TETO);
      const it = gerarItem(U.raridade, U.nivel, U.tipo);
      if (U.raridade === 4 && U.unico) it.unico = U.unico;
      STATE.inventario.push(it); msg = `${it.nome} criado`; break;
    }
    case 'perg-sel': U.perg = v; break;
    case 'rel-sel': U.rel = v; break;
    case 'perg-criar': if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; } STATE.inventario.push(gerarPergaminho(PERGAMINHOS[U.perg].r, U.perg)); msg = 'Pergaminho criado'; break;
    case 'rel-criar': if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; } STATE.inventario.push(gerarReliquia(RELIQUIAS[U.rel].r, U.rel)); msg = 'Relíquia criada'; break;
    case 'cons-todos': for (const k in CONSUMIVEIS) STATE.consumiveis[k] = (STATE.consumiveis[k] || 0) + 5; msg = '+5 de cada consumível'; break;
    case 'campeao': {
      if (STATE.mercs.length >= limiteElenco()) { toast('Elenco cheio.', 'erro'); return; }
      const nm = ajustarAscPorNivel(gerarCampeao(v, nivelRecruta()));
      receberCampeao(nm); msg = `${nm.nome} entrou para a guilda!`; break;
    }
    case 'liga-vencer': {
      if (STATE.liga.fase !== 'liga') return;
      registrarRodada(true, tamanhoTime(), 0); msg = 'Rodada vencida'; break;
    }
    case 'liga-fim': {
      while (STATE.liga.fase === 'liga') registrarRodada(true, tamanhoTime(), 0);
      msg = `Liga encerrada em ${STATE.liga.pos}º`; break;
    }
    case 'torre-mais': STATE.torre.recorde += +v; STATE.torre.inimigo = null; msg = `Recorde: andar ${STATE.torre.recorde}`; break;
    case 'torre-zero': STATE.torre.recorde = 0; STATE.torre.inimigo = null; msg = 'Recorde zerado'; break;
    case 'tributo-reset': STATE.torre.tributoDia = ''; msg = 'Tributo liberado'; break;
    case 'div': {
      STATE.divisao = clamp(+v, 0, DIVISOES.length - 1);
      preencherTime(); ajustarReliquias();
      novaTemporada(STATE.liga.temporada);
      STATE.amistoso = null; msg = `Divisão ${divAtual().nome}`; break;
    }
    case 'esconder': C.liberado = false; UI.toquesVersao = 0; salvar(); fecharTodosModais(); render(); toast('Modo Criador escondido. 7 toques na versão trazem de volta.'); return;
    default: return;
  }
  if (!['it-tipo', 'it-rar', 'it-unico', 'perg-sel', 'rel-sel'].includes(op)) C.usado = true;
  if (msg) toast(msg, 'ok');
  aposMudanca();
}

/* ============================ INTERFACE: AÇÕES ============================ */
function aposMudanca() { salvar(); render(); atualizarModais(); }
const avisoElencoCheio = () => (STATE.construcoes.acampamento < CONSTRUCOES.acampamento.max ? 'Elenco cheio. Venda alguém ou suba o Acampamento para abrir vagas.' : 'Elenco cheio. Venda alguém para abrir vaga.');
const topoModal = () => UI.modais[UI.modais.length - 1];
const MSG_RESULTADO = {
  cheio: 'Inventário cheio.', papel: 'Esse pergaminho não serve para o papel dele.', repetido: 'Ele já tem esse pergaminho.',
  repetida: 'Já há uma relíquia igual equipada.', ouro: 'Ouro insuficiente.', emblemas: 'Emblemas insuficientes.', nivel: 'Nível insuficiente.',
};
const ACOES = {
  'fechar-modal': () => fecharModal(),
  aba: (el) => { UI.aba = el.dataset.id; window.scrollTo(0, 0); render(); },
  coletar: () => {
    const v = Math.floor(STATE.cofre); if (v < 1) return;
    ganharOuro(v); STATE.cofre -= v; salvar(); somTocar('moeda'); toast(`+${fmt(v)} ouro`, 'ouro'); render();
  },
  melhorar: (el) => {
    const id = el.dataset.id, custo = custoMelhoria(id);
    if (STATE.ouro < custo || STATE.construcoes[id] >= nivelMaxConstrucao(id)) return;
    STATE.ouro -= custo; STATE.construcoes[id]++; somTocar('construir');
    toast(`${CONSTRUCOES[id].nome} subiu para o nível ${STATE.construcoes[id]}!`, 'ok'); aposMudanca();
  },

  /* --- elenco e ficha --- */
  'abrir-merc': (el) => abrirFicha(mercPorId(+el.dataset.id), 'elenco'),
  'ver-oferta': (el) => abrirFicha(STATE.taverna.ofertas.find((m) => m.id === +el.dataset.id), 'oferta'),
  'ver-pendente': () => abrirFicha(STATE.campeaoPendente, 'pendente'),
  recrutar: (el) => {
    const m = STATE.taverna.ofertas.find((o) => o.id === +el.dataset.id); if (!m) return;
    if (STATE.mercs.length >= limiteElenco()) { toast(avisoElencoCheio(), 'erro'); return; }
    if (STATE.ouro < precoMerc(m)) { toast('Ouro insuficiente.', 'erro'); return; }
    STATE.ouro -= precoMerc(m);
    STATE.taverna.ofertas = STATE.taverna.ofertas.filter((o) => o !== m);
    STATE.mercs.push(m);
    if (m.campeao && !STATE.campeoesObtidos.includes(m.campeao)) STATE.campeoesObtidos.push(m.campeao);
    if (STATE.time.length < tamanhoTime()) STATE.time.push(m.id);
    ajustarTime();
    toast(`${m.nome} entrou para a guilda!`, 'ok');
    const w = modalCom('ficha'); if (w && w.dados.modo === 'oferta') removerModal(w);
    aposMudanca();
  },
  'recrutar-pendente': () => {
    const m = STATE.campeaoPendente; if (!m) return;
    if (STATE.mercs.length >= limiteElenco()) { toast(avisoElencoCheio(), 'erro'); return; }
    STATE.campeaoPendente = null;
    receberCampeao(m);
    toast(`${m.nome} entrou para a guilda!`, 'ok');
    const w = modalCom('ficha'); if (w && w.dados.modo === 'pendente') removerModal(w);
    aposMudanca();
  },
  renovar: () => {
    const T = STATE.taverna; if (STATE.ouro < T.custo) return;
    STATE.ouro -= T.custo; const novo = T.custo + ECO.custoRenovar;
    renovarTaverna(true); STATE.taverna.custo = novo; aposMudanca();
  },
  comprar: (el) => {
    const it = STATE.taverna.loja.find((i) => i.id === +el.dataset.id); if (!it) return;
    if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; }
    if (STATE.ouro < precoItem(it)) return;
    STATE.ouro -= precoItem(it); STATE.taverna.loja = STATE.taverna.loja.filter((i) => i !== it); STATE.inventario.push(it);
    somTocar('moeda'); toast(`${it.nome} foi para o inventário.`, 'ok'); aposMudanca();
  },
  'comprar-cons': (el) => { if (comprarConsumivel(el.dataset.id)) { somTocar('moeda'); toast(`${CONSUMIVEIS[el.dataset.id].nome} foi para a bolsa.`, 'ok'); aposMudanca(); } },
  'time-add': (el) => {
    const id = +el.dataset.id;
    if (STATE.time.includes(id)) return;
    if (emExpedicao(id)) { toast('Está em expedição.', 'erro'); return; }
    if (STATE.time.length < tamanhoTime()) { STATE.time.push(id); ajustarTime(); aposMudanca(); return; }
    const m = mercPorId(id);
    abrirModal(`<h2>Quem sai para ${esc(m.nome)} entrar?</h2><div class="lista">${timeMercs().map((t) => `<div class="card">${canvasLook(lookMeu(t), 40)}<div class="card-corpo"><b>${esc(t.nome)}</b><small>${CLASSES[t.classe].nome} · nv. ${t.nivel}</small></div><button class="btn" data-act="trocar" data-sai="${t.id}" data-entra="${id}">Trocar</button></div>`).join('')}</div>`, { dados: { troca: true } });
  },
  trocar: (el) => {
    const sai = +el.dataset.sai, entra = +el.dataset.entra;

    if (STATE.capitao === sai) STATE.capitao = entra;
    ajustarTime(); fecharModal(); aposMudanca();
  },
  'time-rem': (el) => { STATE.time = STATE.time.filter((x) => x !== +el.dataset.id); ajustarTime(); aposMudanca(); },
  capitao: (el) => { STATE.capitao = +el.dataset.id; toast('Novo capitão definido.', 'ok'); aposMudanca(); },
  linha: (el) => { const m = mercPorId(+el.dataset.id); m.pos = posDe(el.dataset.v === 'frente' ? 0 : 2, posFileira(m.pos)); m.linha = linhaDePos(m.pos); aposMudanca(); },
  aparencia: (el) => { const m = mercPorId(+el.dataset.id); if (m) abrirModal(htmlAparencia(m), { dados: { aparencia: m.id } }); },
  'ap-set': (el) => {
    const m = mercPorId(+el.dataset.id); if (!m) return;
    garantirAparencia(m);
    const k = el.dataset.k, v = el.dataset.v;
    m.ap[k] = k === 'raca' || k === 'penteado' ? v : +v;
    if (k === 'raca') m.ap.pele = Math.min(m.ap.pele, RACAS[v].peles.length - 1);
    aposMudanca();
  },
  'ap-sortear': (el) => { const m = mercPorId(+el.dataset.id); if (!m) return; m.ap = sortearAparencia(m.classe, m.nome); aposMudanca(); },
  tatica: (el) => { mercPorId(+el.dataset.id).tatica = el.dataset.v; aposMudanca(); },
  postura: (el) => { mercPorId(+el.dataset.id).postura = POSTURAS[el.dataset.v] ? el.dataset.v : 'auto'; aposMudanca(); },
  // grade de formação: 1º toque seleciona o mercenário; 2º toque numa casa move (ou troca de lugar com quem está lá)
  casa: (el) => {
    const pos = +el.dataset.pos, time = timeMercs(), aqui = time.find((m) => m.pos === pos);

  'vender-merc': (el) => {

      <div class="confirmar"><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn perigo" data-act="vender-merc-sim" data-id="${m.id}">Vender</button></div>`);
  },
  'vender-merc-sim': (el) => {
    const m = mercPorId(+el.dataset.id); if (!m) return;
    for (const k of Object.keys(m.equip)) if (m.equip[k]) devolverAoInventario(m.equip[k]);

    STATE.ouro += valorVendaMerc(m);
    STATE.mercs = STATE.mercs.filter((x) => x !== m);
    STATE.time = STATE.time.filter((x) => x !== m.id);
    preencherTime();
    toast(`${m.nome} deixou a guilda. +${fmt(valorVendaMerc(m))} ouro`, 'ouro');
    fecharTodosModais(); aposMudanca();
  },
  evoluir: (el) => {
    const m = mercPorId(+el.dataset.id), k = el.dataset.v, EV = EVOLUCOES[m.classe];
    if (!podeEvoluir(m) || !EV[k]) return;

const nomeEco = (n) => CAMPEOES[ecoDoAndar(n)].nome.split(/[ ,]/)[0];
function escadaTorre(n) {
  const linhas = [];
  for (let k = n + 3; k >= Math.max(1, n - 2); k--) {
    const md = modDoAndar(k), gd = TORRE.guardiao(k), estado = k < n ? 'feito' : k === n ? 'atual' : 'futuro';
    const info = gd ? `Guardião: eco de ${nomeEco(k)}` : md ? md.nome : 'Andar comum';
    const premios = [TORRE.bau(k) ? canvasIcone('bau', 14) : '', TORRE.emblemas(k) ? canvasIcone('emblema', 14) : ''].join('');
    linhas.push(`<div class="andar ${estado} ${gd ? 'guardiao' : ''}">
      <span class="an-num">${k}</span><span class="an-info">${info}</span>
      <span class="an-fim">${estado === 'feito' ? '<i class="ok-marca">vencido</i>' : premios}</span></div>`);
  }
  return `<div class="torre-col" aria-label="Andares da torre"><div class="torre-teto"></div>${linhas.join('')}</div>`;
}
function telaTorre() {
  const T = STATE.torre, n = proximoAndar(), g = inimigoDaTorre(), md = modDoAndar(n), r = recompensaAndar(n), gd = TORRE.guardiao(n);
  const xp = Math.round(ECO.xpBase + ECO.xpPorNivel * TORRE.nivel(n));
  return `
  <section class="painel torre-topo">
    <div class="painel-cab"><h2>${canvasIcone('torre', 20, { a: '#e9dfc9', b: '#a99bb8' })} Torre Infinita</h2><span class="tag">${T.recorde ? `Recorde: andar ${T.recorde}` : 'Sem recorde'}</span></div>
    <p class="dica">Suba andar por andar. Os inimigos ficam mais fortes, muitos andares têm uma regra especial e, a cada 10, um Guardião espera: o eco de um Campeão Lendário. As recompensas vêm na primeira vitória de cada andar.</p>
    ${escadaTorre(n)}
  </section>
  <section class="painel andar-atual ${gd ? 'guardiao' : ''}">
    <div class="painel-cab"><h2>Andar ${n}</h2>${gd ? '<span class="tag ouro">Guardião</span>' : `<span class="tag">inimigos nv. ${TORRE.nivel(n)}</span>`}</div>
    ${md ? `<div class="mod-andar"><b>${md.nome}</b><small>${md.desc}</small></div>` : '<p class="dica">Sem regra especial neste andar.</p>'}
    ${gd ? `<div class="lider"><div class="retrato chefe">${canvasLook(lookDe(g.mercs[0], g.cor1, g.cor2), 72)}</div><div><span class="tag ouro">Guardião da Torre</span><b>${esc(g.mercs[0].nome)}</b><small>${SKILLS[skillDe(g.mercs[0])].nome}: ${SKILLS[skillDe(g.mercs[0])].fx.toLowerCase()}.</small><small class="muted">Atributos de Campeão ×1,2.</small></div></div>` : ''}
    ${htmlConfronto(g, multDificuldade() * TORRE.mult(n))}
    <div class="premios-andar"><span class="rot">Recompensa da 1ª vitória</span>
      <div class="premios">
        <span>${canvasIcone('moeda', 16)} +${fmt(r.ouro)}</span><span>+${fmt(xp)} XP</span>
        ${r.emblemas ? `<span>${canvasIcone('emblema', 16)} +${r.emblemas}</span>` : ''}
        ${r.bau >= 0 ? `<span>${canvasIcone('bau', 16)} baú${r.bau >= 2 ? ' Raro ou melhor' : ''}</span>` : ''}
      </div></div>
    ${htmlPreparo()}
    <button class="btn primario enorme" data-act="lutar-torre">${gd ? 'Enfrentar o Guardião' : `Subir para o andar ${n}`}</button>
  </section>
  <section class="painel">
    <div class="painel-cab"><h2>${canvasIcone('moeda', 20)} Tributo da Torre</h2><span class="muted">1 vez por dia</span></div>
    <p class="dica">Quanto mais alto o recorde, maior o tributo: 25 de ouro por andar conquistado.</p>
    <button class="btn ${tributoDisponivel() ? 'primario' : ''} largo" data-act="tributo" ${tributoDisponivel() ? '' : 'disabled'}>${T.recorde === 0 ? 'Vença o 1º andar para liberar' : tributoDisponivel() ? `Coletar +${fmt(valorTributo())} ouro` : 'Coletado hoje. Volte amanhã'}</button>
  </section>`;
}

/* ---- estatísticas ---- */
function fmtCompacto(n) {
  n = Math.round(n || 0);
  if (n >= 1e6) return `${fmt1(n / 1e6)} mi`;
  if (n >= 1e4) return `${fmt1(n / 1e3)} mil`;
  return fmt(n);
}
const COPA_TXT = { campeao: 'Campeão', vice: 'Vice', semi: 'Semifinal' };
function htmlEstatisticas() {
  const S = STATE.stats, taxa = S.lutas ? Math.round((S.vitorias / S.lutas) * 100) : 0;
  const tile = (rot, valor, sub) => `<div class="kpi"><span class="rot">${rot}</span><b>${valor}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  const kpis = [
    tile('Vitórias', fmt(S.vitorias), `${fmt(S.lutas)} partidas · ${taxa}%${S.rodadas > S.lutas ? ` · ${fmt(S.rodadas)} lutas` : ''}`),
    tile('Temporadas', fmt(S.temporadas), `${fmt(S.copas)} ${S.copas === 1 ? 'Copa' : 'Copas'} · ${fmt(S.promocoes)} ${S.promocoes === 1 ? 'promoção' : 'promoções'}`),
    tile('Guardiões', fmt(S.guardioes), `${fmt(S.torreLutas)} lutas na Torre`),
    tile('Maior golpe', fmt(S.maiorGolpe), `${fmt(S.supremos)} supremos`),
    tile('Dano total', fmtCompacto(S.dano), `${fmt(S.abates)} abates · ${fmt(S.mortes)} quedas`),
    tile('Cura total', fmtCompacto(S.cura), `${fmtTempo(S.tempoLuta * 1000)} em luta`),
    tile('Ouro ganho', fmtCompacto(S.ouroGanho), `${fmt(S.baus)} baús abertos`),
    tile('Lendários', fmt(S.lendarios), `${fmt(S.expedicoes)} expedições`),
  ];
  const st = (m) => m.stats || statsMercPadrao();
  const mercs = STATE.mercs.slice().sort((a, b) => (st(b).dano - st(a).dano) || (st(b).lutas - st(a).lutas));
  const maxDano = Math.max(1, ...mercs.map((m) => st(m).dano));
  const linhasMerc = mercs.map((m) => `<div class="est-merc">
      ${canvasLook(lookMeu(m), 32)}
      <div class="em-corpo"><div class="em-linha"><b>${nomeMerc(m)}</b><span class="em-valor">${fmtCompacto(st(m).dano)}</span></div>
        <div class="em-barra"><i style="width:${Math.max(st(m).dano ? 2 : 0, (st(m).dano / maxDano) * 100)}%"></i></div>
        <small>${CLASSES[m.classe].papel} · ${fmt(st(m).lutas)} lutas · ${fmt(st(m).abates)} abates · ${fmt(st(m).mvp)} MVP</small></div></div>`).join('');
  const hist = STATE.historico.slice().reverse();
  const linhasHist = hist.map((h) => { const d = DIVISOES[h.div] || DIVISOES[0]; return `<tr><td>${h.t}</td><td><span class="div-tag" style="--dc:${d.cor}">${d.nome}</span></td><td><b>${h.pos}º</b></td><td>${h.copa ? COPA_TXT[h.copa] : '—'}</td><td class="${h.mov}">${h.mov === 'sobe' ? 'Subiu' : h.mov === 'cai' ? 'Caiu' : '—'}</td></tr>`; }).join('');
  return `<h2>${canvasIcone('estatisticas', 22)} Estatísticas</h2>
    ${htmlRastro(tile)}
    ${htmlMelhoresTemporada()}
    <section class="est-sec"><h3>Totais da guilda</h3><div class="kpis">${kpis.join('')}</div></section>
    <section class="est-sec"><h3>Mercenários</h3><p class="dica">Dano total causado por cada um desde que entrou na guilda.</p>
      ${linhasMerc || '<p class="vazio">Sem lutas ainda.</p>'}</section>
    ${htmlUltimasLutas()}
    <section class="est-sec"><h3>Temporadas</h3>
      ${hist.length ? `<div class="tabela-wrap"><table class="tabela"><thead><tr><th>Temp.</th><th>Divisão</th><th>Posição</th><th>Copa</th><th>Divisão seguinte</th></tr></thead><tbody>${linhasHist}</tbody></table></div>` : '<p class="vazio">O histórico aparece quando a primeira temporada terminar.</p>'}</section>`;
}
// Ficha de rastro: sequência, Torre, Líder mais derrotado e tempo de jogo
function htmlRastro(tile) {
  const S = STATE.stats, lv = Object.entries(S.lideresVencidos || {}).sort((a, b) => b[1] - a[1])[0];
  const lider = lv && LIDERES.find((l) => l.id === lv[0]);
  return `<section class="est-sec"><h3>Recordes</h3><div class="kpis">
    ${tile('Sequência de vitórias', fmt(S.seqAtual), `recorde: ${fmt(S.seqRecorde)}`)}
    ${tile('Melhor andar da Torre', STATE.torre.recorde ? `andar ${STATE.torre.recorde}` : '—', `${fmt(S.guardioes)} ${S.guardioes === 1 ? 'Guardião vencido' : 'Guardiões vencidos'}`)}
    ${tile('Líder mais derrotado', lider ? esc(lider.nome) : '—', lider ? `${fmt(lv[1])} ${lv[1] === 1 ? 'vitória' : 'vitórias'} na final` : S.lideres ? 'conta a partir da v0.6' : 'vença a final da Copa')}
    ${tile('Tempo de jogo', fmtDuracao((S.tempoJogo || 0) / 60000), 'com o jogo aberto, desde a v0.6')}
  </div></section>`;
}
// Melhores da temporada: 5 categorias, filtro por função, meus heróis contra os das guildas rivais
function htmlMelhoresTemporada() {
  const f = UI.recFuncao && (UI.recFuncao === 'todas' || FUNCOES[UI.recFuncao]) ? UI.recFuncao : 'todas';
  const R = STATE.temporadaRec, t = STATE.liga ? STATE.liga.temporada : 1;
  const chips = [['todas', 'Todas'], ...Object.entries(FUNCOES)].map(([id, n]) => `<button class="chip-btn alto ${f === id ? 'on' : ''}" data-act="rec-funcao" data-id="${id}">${n}</button>`).join('');
  const linha = (c) => ({ h, pos }) => `<div class="rec-linha ${h.meu ? 'meu' : ''}"><span class="rec-pos">${pos}º</span>${canvasLook(h.look, 26)}
    <div class="rec-nome"><b>${esc(h.nome)}</b><small>${h.meu ? 'sua guilda' : esc(h.guilda)} · ${FUNCOES[funcaoDe(h.cls)]}</small></div><span class="rec-valor">${c.txt(h)}</span></div>`;
  const cards = CATEGORIAS_TEMPORADA.map((c) => {
    const top = rankingTemporada(c, f);
    return `<div class="rec-cat" data-cat="${c.id}"><div class="rec-cab"><b>${c.nome}</b>${c.dica ? `<small>${c.dica}</small>` : ''}</div>
      ${top.length ? top.map(linha(c)).join('') : '<p class="vazio">Ninguém ainda.</p>'}</div>`;
  }).join('');
  return `<section class="est-sec melhores"><h3>Melhores da temporada ${t}</h3>
    <p class="dica">Seus heróis contra os das guildas rivais, em todas as lutas desta temporada. Os seus aparecem destacados.</p>
    <div class="filtros">${chips}</div>
    ${R && Object.keys(R.herois).length ? cards : '<p class="vazio">Os melhores aparecem depois da primeira luta da temporada.</p>'}</section>`;
}
const TIPO_LUTA = { liga: 'Liga', copa: 'Copa', torre: 'Torre', amistoso: 'Amistoso' };
function htmlUltimasLutas() {
  const lista = STATE.partidas.slice(-10).reverse();
  if (!lista.length) return '<section class="est-sec"><h3>Últimas lutas</h3><p class="vazio">O registro começa na próxima luta.</p></section>';
  const linhas = lista.map((p) => {
    const mvp = p.times[0].find((u) => u.mvp) || p.times[0][0];
    return `<div class="partida"><span class="tag ${p.vit ? 'vit' : 'der'}">${p.vit ? 'V' : 'D'}</span>
      <div class="pt-corpo"><b>${TIPO_LUTA[p.tipo] || p.tipo}${p.tipo === 'torre' && p.andar ? ` ${p.andar}` : ''} · ${esc(p.rival)}</b>
        <small>Luta nº ${p.n}${p.serie ? ` · luta ${p.serie.rodada} de até ${p.serie.de} (${p.serie.placar[0]}×${p.serie.placar[1]})` : ''} · ${fmtTempo(p.tempo * 1000)} · destaque: ${esc(mvp ? mvp.nome : '—')}${p.criador ? ' · Modo Criador' : ''}</small></div>
      ${p.replay ? `<button class="btn pequeno" data-act="conferir-partida" data-n="${p.n}">Conferir</button>` : ''}</div>`;
  }).join('');
  return `<section class="est-sec"><h3>Últimas lutas</h3>
    <p class="dica">Cada luta fica registrada com a semente e os times. "Conferir" roda a luta de novo, sem tela, e confere se o resultado é idêntico.</p>
    ${linhas}</section>`;
}
function abrirEstatisticas() { abrirModal(htmlEstatisticas(), { dados: { estatisticas: true } }); }

/* ============================ INÍCIO ============================ */
let ultimoTick = Date.now(), ultimoSave = Date.now();
const expAvisadas = new Set();
function tickOcioso() {
  if (!STATE) return;
  const agora = Date.now(), min = (agora - ultimoTick) / 60000;
  ultimoTick = agora;
  if (!document.hidden && min < 0.1) STATE.stats.tempoJogo += min * 60000;   // tempo de jogo: só com a tela aberta
  const r = aplicarTempo(min);
  if (min > 5) mostrarResumoOffline(r);           // voltou depois de um tempo em segundo plano
  else if (r.subidas.length) {
    for (const s of r.subidas) toast(`${s.m.nome} subiu para o nível ${s.para} no Campo de Treino!`, 'ok');
    if (!Luta) { renderTela(); atualizarModais(); }
  }
  let voltou = false;
  for (const e of expedicoesProntas()) {
    if (expAvisadas.has(e.id)) continue;
    expAvisadas.add(e.id); voltou = true;
    if (min <= 5) { const m = mercPorId(e.mercId); if (m) toast(`${m.nome} voltou ${EXPEDICOES[e.tipo].da}! Colete na Guilda.`, 'ok'); }
  }
  if (voltou && UI.aba === 'guilda' && !Luta && !UI.modais.length) renderTela();
  if (verificarTaverna() && UI.aba === 'mercado' && !Luta) renderTela();
  atualizarVivos();
  if (agora - ultimoSave > 30000) { salvar(false); ultimoSave = agora; }
}
// Abre um save (deste aparelho, da conta ou importado): ganhos offline, liga, time e tela
function entrarNoJogo(st, resumo = true) {
  STATE = st;
  const r = aplicarTempo((Date.now() - STATE.ultimaVez) / 60000);
  verificarTaverna();
  if (!STATE.liga) novaTemporada(1);
  preencherTime(); ajustarReliquias();
  expAvisadas.clear();
  for (const e of expedicoesProntas()) expAvisadas.add(e.id);
  salvar();
  ultimoTick = Date.now();
  abrirApp();
  if (resumo && !temNovidades()) mostrarResumoOffline(r);
}
function start(data) {
  let st = null, veioDoHot = false;
  if (data && data.save) { try { st = validarSave(data.save); veioDoHot = true; } catch (e) { st = null; } }
  if (!st) st = carregarLocal();
  Nuvem.localEm = st ? st.ultimaVez || 0 : 0;
  if (st) entrarNoJogo(st, !veioDoHot); else mostrarCriacao();
  ultimoTick = Date.now();
  setInterval(tickOcioso, 1000);
  setInterval(animarSprites, 220);
  setInterval(cicloNuvem, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { salvar(); enviarNuvem(); } });
  window.addEventListener('pagehide', () => { salvar(); enviarNuvem(); });
  iniciarNuvem();
}
try { window.claude?.hot?.snapshot?.(() => ({ save: STATE })); } catch (e) { /* fora do visualizador */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});

</script>
