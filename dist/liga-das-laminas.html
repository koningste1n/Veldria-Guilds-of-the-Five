   abas como placas no rodapé, arena em tela cheia na hora da luta. Visual único, escuro, de propósito. */
:root {
  color-scheme: dark;
  --bg: #16111f; --bg2: #1c1528; --painel: #241c33; --painel2: #2e2442; --linha: #46395d; --linha-esc: #0c0812;
  --tinta: #f1e7d0; --muted: #a99bb8; --fraco: #7b6e8c; --ouro: #f0c24b; --ouro-esc: #a87a1f; --ouro-tx: #2a1c08;
  --tocha: #e8743b; --bom: #6cc76a; --ruim: #e0574f; --gelo: #7fd6ff; --roxo: #bd86f5;
  --f-display: 'Silkscreen', ui-monospace, 'Courier New', monospace;
  --f-corpo: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --entalhe: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--tinta); font-family: var(--f-corpo); font-size: 15px; line-height: 1.35;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.018) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.018) 75%),
    linear-gradient(45deg, rgba(255,255,255,.018) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.018) 75%);
  background-size: 8px 8px; background-position: 0 0, 4px 4px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation;
}
body.com-modal { overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; touch-action: manipulation; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 20px; line-height: 1.15; }
h2 { font-size: 14px; display: flex; align-items: center; gap: 8px; }
p { margin: 0; }
small { font-size: 13px; }
.muted { color: var(--muted); }
.dica { color: var(--muted); font-size: 13px; }
.vazio { color: var(--muted); padding: 10px 0; text-align: center; }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

/* ---------- estrutura ---------- */
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
#topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  margin-inline: -16px; padding: 10px 16px; background: var(--bg2); border-bottom: 2px solid var(--linha-esc);
  box-shadow: 0 2px 0 var(--linha);
}
.topo-guilda { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.topo-guilda > div { min-width: 0; display: flex; flex-direction: column; }
.topo-nome { font-family: var(--f-display); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-guilda small { color: var(--muted); font-size: 12px; }
.topo-rec { display: flex; flex-direction: column; gap: 1px; background: var(--linha-esc); padding: 3px 9px 3px 5px; clip-path: var(--entalhe); }
.topo-rec > span { display: flex; align-items: center; gap: 4px; }
.topo-rec b { font-family: var(--f-display); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.topo-rec b.ouro { color: var(--ouro); }
.topo-rec b.emb { color: #ff9a8a; }
.selo-criador { display: grid; place-items: center; padding: 5px; background: #3a2a10; clip-path: var(--entalhe); }
.btn-icone { background: var(--painel2); border: 0; padding: 7px; clip-path: var(--entalhe); cursor: pointer; display: grid; place-items: center; }
#tela { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
#abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  background: var(--bg2); border-top: 2px solid var(--linha-esc); box-shadow: 0 -2px 0 var(--linha);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
#abas .wrap { display: flex; width: 100%; max-width: 480px; gap: 4px; }
.aba { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 6px 2px; cursor: pointer; color: var(--muted); clip-path: var(--entalhe); }
.aba span { font-family: var(--f-display); font-size: 9px; letter-spacing: 0; }
.aba.ativa { background: var(--painel2); color: var(--ouro); }
.aba.destaque { animation: pulsar 1s steps(2) infinite; }
@keyframes pulsar { 50% { background: var(--ouro-esc); color: var(--ouro-tx); } }

/* ---------- painéis e cartões ---------- */
.painel { background: var(--painel); clip-path: var(--entalhe); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 2px var(--linha), inset 0 -4px 0 rgba(0,0,0,.25); }
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.painel.em-breve { background: var(--bg2); box-shadow: inset 0 0 0 2px var(--linha); opacity: .85; }
.heroi { flex-direction: row; align-items: center; gap: 14px; background: linear-gradient(180deg, var(--painel2), var(--painel)); }
.heroi > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.heroi h1 { overflow-wrap: anywhere; }
.recorde { display: flex; flex-wrap: wrap; gap: 6px; }
.lista { display: flex; flex-direction: column; gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; background: var(--painel2); padding: 10px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); }
.card[role="button"] { cursor: pointer; }
.card[role="button"]:active { transform: translateY(1px); }
.card-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-corpo small { color: var(--muted); }
.card-corpo small.ok { color: var(--bom); }
.card-corpo small.ruim { color: var(--ruim); }
.card-corpo .stats { color: var(--tinta); font-variant-numeric: tabular-nums; font-size: 12px; }
.linha1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nivel { font-family: var(--f-display); font-size: 11px; color: var(--muted); font-weight: 400; }
.prox { color: var(--bom); }
.ok { color: var(--bom); }
.ruim { color: var(--ruim); }
.poder { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--f-display); color: var(--ouro); font-size: 13px; }
.poder small { color: var(--muted); font-family: var(--f-corpo); font-size: 11px; }
.tag { display: inline-block; font-family: var(--f-display); font-size: 10px; padding: 3px 6px; background: var(--linha-esc); color: var(--tinta); clip-path: var(--entalhe); white-space: nowrap; }
.tag.ouro { background: var(--ouro); color: var(--ouro-tx); }
.tag.no-time { background: #1f3a2b; color: #a7f0a0; }
.pot { display: inline-grid; place-items: center; width: 20px; height: 20px; font-family: var(--f-display); font-size: 12px; font-weight: 700; color: #160f1d; background: var(--c); clip-path: var(--entalhe); }
.tracos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.chip { font-size: 12px; padding: 1px 6px; background: #213a2d; color: #b6f0ad; clip-path: var(--entalhe); }
.chip.neg { background: #432026; color: #ffb3a8; }

/* ---------- botões ---------- */
.btn {
  font-family: var(--f-display); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 12px; border: 0; cursor: pointer; color: var(--tinta); background: #3d3155; clip-path: var(--entalhe);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.12); text-transform: uppercase; white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--ouro); color: var(--ouro-tx); }
.btn.perigo { background: #7a2a2f; color: #ffd9d4; }
.btn.pequeno { min-height: 36px; padding: 6px 10px; font-size: 11px; }
.btn.largo { width: 100%; }
.btn.enorme { width: 100%; min-height: 54px; font-size: 16px; }
.chip-btn { font-family: var(--f-corpo); font-size: 13px; min-height: 36px; padding: 6px 10px; border: 0; background: var(--linha-esc); color: var(--muted); clip-path: var(--entalhe); cursor: pointer; }
.chip-btn.on { background: var(--ouro); color: var(--ouro-tx); font-weight: 600; }
.chips-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rot { font-family: var(--f-display); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; width: 100%; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- barras ---------- */
.barra { position: relative; height: 8px; background: var(--linha-esc); clip-path: var(--entalhe); overflow: hidden; }
.barra i { position: absolute; inset: 0 auto 0 0; background: var(--bom); }
.barra.grande { height: 26px; }
.barra.grande i { background: linear-gradient(180deg, #ffe48a, var(--ouro) 50%, var(--ouro-esc)); }
.barra.grande span { position: relative; display: grid; place-items: center; height: 100%; font-family: var(--f-display); font-size: 12px; color: var(--tinta); text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
.barra.xp i { background: var(--roxo); }

/* ---------- construções ---------- */
.constr .btn { flex: none; }

/* ---------- elenco ---------- */
.slots { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
.slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; background: var(--painel2); border: 0; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); cursor: pointer; min-width: 0; text-align: center; }
.slot b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot small { color: var(--muted); font-size: 11px; }
.slot.capitao { box-shadow: inset 0 0 0 2px var(--ouro); }
.slot .coroa { position: absolute; top: 6px; right: 6px; }
.slot.vazio { justify-content: center; min-height: 120px; cursor: default; color: var(--muted); }
.linha-tag { font-family: var(--f-display); font-size: 9px; padding: 2px 5px; margin-top: 2px; background: var(--linha-esc); clip-path: var(--entalhe); }
.linha-tag.frente { color: var(--tocha); }
.linha-tag.tras { color: var(--gelo); }

/* ---------- ficha ---------- */
.ficha-topo { display: flex; gap: 12px; align-items: center; }
.ficha-topo .retrato { background: radial-gradient(circle at 50% 70%, #3d3155, var(--painel2) 70%); padding: 6px; clip-path: var(--entalhe); }
.ficha-topo > div:last-child { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.ficha-topo h2 { font-size: 16px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--painel2); padding: 8px 10px; clip-path: var(--entalhe); display: flex; flex-direction: column; gap: 1px; }
.stat .rot { width: auto; }
.stat b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--muted); }
.stat small.prox { color: var(--bom); }
.derivados { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; }
.derivados span { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dashed var(--linha); padding: 3px 0; }
.derivados b { font-variant-numeric: tabular-nums; }
.hab { background: var(--painel2); padding: 10px; clip-path: var(--entalhe); display: flex; flex-direction: column; gap: 4px; }
.hab-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.equips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.equip-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 0; background: var(--painel2); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--rc, var(--linha)); cursor: pointer; min-width: 0; text-align: center; }
.equip-slot small { font-size: 11px; color: var(--muted); }
.equip-slot b { font-size: 11px; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
.equip-vazio { width: 36px; height: 36px; display: grid; place-items: center; border: 2px dashed var(--linha); color: var(--fraco); font-family: var(--f-display); }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.acoes .btn { flex: 1 1 auto; }

/* ---------- itens ---------- */
.item { box-shadow: inset 0 0 0 2px var(--rc); }
.item-ico { background: var(--linha-esc); padding: 4px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--rc); flex: none; }
.bonus { color: var(--tinta) !important; }
.unico { color: var(--ouro) !important; }
.grade-itens { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--rc); cursor: pointer; }
.tile small { font-size: 11px; color: var(--muted); }
.tile.r4 { animation: brilho 1.2s steps(3) infinite; }
@keyframes brilho { 50% { box-shadow: inset 0 0 0 2px #fff4c2, 0 0 0 0 transparent; } }
.tabela-rar { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela-rar td, .tabela-rar th { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--linha); }
.tabela-rar th { font-family: var(--f-display); font-size: 9px; color: var(--muted); font-weight: 400; }
.tabela-rar td:first-child { text-align: left; font-weight: 600; }

/* ---------- liga ---------- */
.confronto { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.lado-c { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.lado-c b { font-size: 13px; overflow-wrap: anywhere; }
.lado-c small { color: var(--muted); font-variant-numeric: tabular-nums; }
.vs { font-family: var(--f-display); font-size: 20px; color: var(--tocha); }
.rival-elenco { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mini { display: flex; align-items: center; gap: 4px; background: var(--painel2); padding: 4px; clip-path: var(--entalhe); min-width: 0; }
.mini small { font-size: 11px; color: var(--muted); line-height: 1.25; min-width: 0; }
.mini .pot { width: 16px; height: 16px; font-size: 10px; }
.tabela-wrap { overflow-x: auto; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tabela th { font-family: var(--f-display); font-size: 9px; color: var(--muted); font-weight: 400; padding: 4px; }
.tabela td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--linha); }
.tabela .esq { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabela tr.eu td { background: rgba(240,194,75,.12); color: var(--ouro); }
.tabela tr.sobe td:first-child { color: var(--bom); }
.resultados { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.resultados li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--linha); }
.resultados li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.resultados li span:last-child { text-align: right; }
.resultados li span.venceu { color: var(--tinta); font-weight: 600; }
.resultados li b { font-family: var(--f-display); font-size: 11px; }
.fim-temp .pos-final { font-family: var(--f-display); font-size: 32px; color: var(--ouro); }

/* ---------- modais ---------- */
#modais { position: relative; z-index: 60; }
.modal-fundo { position: fixed; inset: 0; background: rgba(8,5,12,.78); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.modal { position: relative; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; background: var(--painel); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); padding: 18px 16px 16px; overscroll-behavior: contain; }
.modal-corpo { display: flex; flex-direction: column; gap: 12px; }
.modal-x + .modal-corpo > :first-child { margin-right: 40px; }
.modal-x { position: sticky; top: 0; display: block; margin: -8px -6px -32px auto; width: 40px; height: 40px; border: 0; background: var(--linha-esc); color: var(--tinta); font-family: var(--f-display); font-size: 18px; cursor: pointer; clip-path: var(--entalhe); z-index: 2; }
@media (min-height: 700px) { .modal-fundo { align-items: center; } }
.confirmar { display: flex; gap: 8px; }
.confirmar .btn { flex: 1; }
textarea { width: 100%; min-height: 120px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; background: var(--linha-esc); color: var(--tinta); border: 2px solid var(--linha); padding: 8px; word-break: break-all; }
input[type=text], input:not([type]) { width: 100%; min-width: 0; min-height: 44px; font-family: var(--f-corpo); font-size: 16px; background: var(--linha-esc); color: var(--tinta); border: 2px solid var(--linha); padding: 8px 10px; }
label { font-family: var(--f-display); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- toasts e tutorial ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--painel2); color: var(--tinta); padding: 10px 12px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); font-size: 14px; animation: entrar .18s steps(3); }
.toast.ok { box-shadow: inset 0 0 0 2px var(--bom); }
.toast.erro { box-shadow: inset 0 0 0 2px var(--ruim); }
.toast.ouro { box-shadow: inset 0 0 0 2px var(--ouro); color: var(--ouro); }
@keyframes entrar { from { transform: translateY(-8px); opacity: 0; } }
#tutorial { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
.tut-balao { pointer-events: auto; width: 100%; max-width: 448px; background: #fff4d6; color: #2a1c08; padding: 12px 14px; clip-path: var(--entalhe); display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 0 2px var(--ouro-esc), inset 0 -4px 0 rgba(0,0,0,.12); }
.tut-balao small { font-family: var(--f-display); font-size: 10px; color: var(--ouro-esc); }
.tut-balao .btn { align-self: flex-end; }

/* ---------- criação da guilda ---------- */
#criacao { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; }
.criacao { display: flex; flex-direction: column; gap: 12px; text-align: center; }
.eyebrow { font-family: var(--f-display); font-size: 10px; color: var(--tocha); letter-spacing: .12em; text-transform: uppercase; }
.titulo-jogo { font-size: 40px; line-height: 1.15; color: var(--ouro); text-shadow: 3px 3px 0 #6b3a14, 6px 6px 0 var(--linha-esc); text-transform: uppercase; }
.criacao .painel { text-align: left; gap: 8px; }
.brasao-preview { display: grid; place-items: center; padding: 8px; }
.linha-input { display: flex; gap: 8px; }
.cores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.cor { aspect-ratio: 1; min-height: 36px; border: 0; background: var(--c); clip-path: var(--entalhe); cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
.cor.on { box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #000; }
.simbolos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.simb { display: grid; place-items: center; padding: 6px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); cursor: pointer; }
.simb.on { background: var(--ouro-esc); }

/* ---------- luta ---------- */
#luta { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.luta-in { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.luta-topo { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.lt-lado { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lt-lado > div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.lt-lado b { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-lado.dir { text-align: right; }
.lt-lado.dir .barra i { inset: 0 0 0 auto; }
.barra.time0 i { background: var(--bom); }
.barra.time1 i { background: var(--ruim); }
.lt-meio { display: flex; flex-direction: column; align-items: center; }
#relogio { font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; }
#furia { font-family: var(--f-display); font-size: 9px; color: var(--ruim); animation: pulsar 0.6s steps(2) infinite; }
.arena-wrap { position: relative; background: #000; clip-path: var(--entalhe); }
#arena { width: 100%; max-width: 100%; height: auto; aspect-ratio: 256 / 180; image-rendering: pixelated; display: block; cursor: crosshair; }
#banner { position: absolute; left: 0; right: 0; top: 4%; text-align: center; pointer-events: none; }
#banner .b-in { display: inline-flex; flex-direction: column; align-items: center; background: rgba(12,8,18,.86); padding: 8px 16px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--ouro); animation: banner 1.3s steps(6) forwards; }
#banner b { font-family: var(--f-display); font-size: 22px; color: var(--ouro); }
#banner small { font-size: 13px; }
@keyframes banner { 0% { transform: scale(1.4); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
#contagem { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--f-display); font-size: 42px; color: var(--ouro); text-shadow: 3px 3px 0 #000; }
.hud-time { display: flex; flex-direction: column; gap: 6px; }
.hud-u { display: flex; align-items: center; gap: 8px; background: var(--painel); padding: 6px 8px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); }
.hud-u.cap { box-shadow: inset 0 0 0 2px var(--ouro-esc); }
.hud-u.morto { opacity: .4; filter: grayscale(1); }
.hud-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hud-info b { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.hud-sk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center; }
.hud-sk span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.barra.vida i { background: var(--bom); transition: width .1s steps(2); }
.barra.cd { height: 5px; }
.barra.cd i { background: var(--gelo); }
.luta-ctrl { display: flex; flex-direction: column; gap: 8px; }
.btn-supremo { position: relative; min-height: 54px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); cursor: pointer; overflow: hidden; box-shadow: inset 0 0 0 2px var(--ouro-esc); }
.btn-supremo .sup-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(180deg, #ffe48a, var(--ouro) 55%, var(--ouro-esc)); }
.btn-supremo .sup-txt { position: relative; font-family: var(--f-display); font-size: 16px; font-weight: 700; color: var(--tinta); text-shadow: 2px 2px 0 #000; }
.btn-supremo.pronto { animation: pronto .5s steps(2) infinite; }
.btn-supremo.pronto .sup-txt { color: #fff; }
.btn-supremo:disabled { cursor: default; }
@keyframes pronto { 50% { box-shadow: inset 0 0 0 4px #fff4c2; } }
.ctrl-linha { display: flex; gap: 6px; flex-wrap: wrap; }
.ctrl-linha .btn { flex: 1 1 auto; }
.seg { display: flex; gap: 2px; }
.seg-btn { min-width: 42px; min-height: 36px; border: 0; background: var(--linha-esc); color: var(--muted); font-family: var(--f-display); font-size: 11px; cursor: pointer; clip-path: var(--entalhe); }
.seg-btn.on { background: var(--ouro); color: var(--ouro-tx); }

/* ---------- resultado ---------- */
.resultado { display: flex; flex-direction: column; gap: 12px; }
.res-titulo { font-size: 30px; text-transform: uppercase; justify-content: center; }
.resultado.vit .res-titulo { color: var(--ouro); text-shadow: 3px 3px 0 #6b3a14; }
.resultado.der .res-titulo { color: var(--ruim); text-shadow: 3px 3px 0 #3a1015; }
.resultado > .muted { text-align: center; }
.mvp { display: flex; align-items: center; gap: 12px; background: var(--painel2); padding: 10px; clip-path: var(--entalhe); }
.mvp > div { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; }
.mvp small { color: var(--muted); }
.barras-res { display: flex; flex-direction: column; gap: 6px; }
.br-linha { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.br-linha span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-barras { display: flex; flex-direction: column; gap: 2px; }
.br-linha small { color: var(--muted); font-variant-numeric: tabular-nums; }
.barra.dano i { background: var(--tocha); }
.barra.cura i { background: var(--bom); }
.recompensas { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.recompensas > span { display: flex; align-items: center; gap: 6px; background: var(--linha-esc); padding: 6px 10px; clip-path: var(--entalhe); font-weight: 600; }
.subidas { display: flex; flex-direction: column; gap: 6px; }
.subida { background: #1f3a2b; padding: 8px 10px; clip-path: var(--entalhe); display: flex; flex-direction: column; }
.subida small { color: #a7f0a0; }
.subida b { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nivel-up { animation: brilhaTag .5s steps(2) infinite; }
@keyframes brilhaTag { 50% { background: #fff4c2; } }
.btn-bau { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); cursor: pointer; box-shadow: inset 0 0 0 2px var(--ouro-esc); font-family: var(--f-display); font-size: 12px; color: var(--ouro); }
.btn-bau canvas { animation: sacode .4s steps(2) infinite; }
@keyframes sacode { 50% { transform: translateX(2px) rotate(3deg); } }
.revelado { animation: revela .5s steps(4); }
@keyframes revela { from { transform: scale(.6); opacity: 0; filter: brightness(3); } }


/* ---------- Fase 2 ---------- */
.aba .ponto { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; background: var(--ruim); box-shadow: 0 0 0 2px var(--bg2); }
.div-tag { display: inline-block; font-family: var(--f-display); font-size: 10px; padding: 2px 6px; margin-right: 4px; color: #160f1d; background: var(--dc); clip-path: var(--entalhe); }
.efeitos { display: flex; flex-direction: column; gap: 6px; }
.efeito { display: flex; align-items: center; gap: 8px; background: #2a2040; padding: 8px 10px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--roxo); font-size: 13px; }
.efeito b { font-variant-numeric: tabular-nums; }
.ouro-tx { color: var(--ouro) !important; }
.nome-campeao { color: var(--ouro); text-shadow: 1px 1px 0 #6b3a14; }
.card.campeao, .slot.campeao { box-shadow: inset 0 0 0 2px var(--ouro-esc); background: linear-gradient(180deg, #3a2d1a, var(--painel2) 60%); }
.slot.campeao.capitao { box-shadow: inset 0 0 0 2px var(--ouro); }
.retrato.campeao { box-shadow: inset 0 0 0 2px var(--ouro); }
.estrelas { display: inline-flex; gap: 1px; vertical-align: middle; }
.tag.exp { background: #1d3550; color: #a8dcff; }
.chip.perg { background: var(--linha-esc); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--rc); }
.slots .slot { padding-inline: 2px; }
.slots .slot small { font-size: 10px; }
.barra.exp { height: 7px; margin: 3px 0 1px; }
.barra.exp i { background: linear-gradient(90deg, var(--gelo), #b9ecff); }
.exped.pronta { box-shadow: inset 0 0 0 2px var(--bom); }
.exped.pronta .barra.exp i { background: var(--bom); }
.escolha-merc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip-merc { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; padding: 6px 4px; border: 0; background: var(--linha-esc); color: var(--muted); clip-path: var(--entalhe); cursor: pointer; text-align: center; }
.chip-merc small { font-size: 11px; line-height: 1.2; overflow-wrap: anywhere; }
.chip-merc.on { background: var(--ouro-esc); color: var(--tinta); box-shadow: inset 0 0 0 2px var(--ouro); }
.chip-merc.trava { opacity: .45; }
.exp-sel-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.exp-sel-cab .rot { margin: 0; width: auto; }
.secao { display: flex; flex-direction: column; gap: 8px; }
.slot-perg { min-height: 44px; border: 2px dashed var(--linha); background: none; color: var(--muted); font-family: var(--f-display); font-size: 11px; cursor: pointer; }
.slot-perg:active { transform: translateY(1px); }
.hab.perg { box-shadow: inset 0 0 0 2px var(--rc); }
.hab.perg .btn { align-self: flex-start; }
.hab.lendaria { box-shadow: inset 0 0 0 2px var(--ouro-esc); background: linear-gradient(180deg, #3a2d1a, var(--painel2)); }
.asc { display: flex; flex-direction: column; gap: 6px; background: var(--painel2); padding: 10px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); }
.asc.pronta { box-shadow: inset 0 0 0 2px var(--ouro); }
.asc.max { box-shadow: inset 0 0 0 2px var(--ouro-esc); }
.asc-cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.asc small { color: var(--muted); }
.rel-grade { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
.rel-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 3px 6px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--rc, var(--linha)); cursor: pointer; color: var(--tinta); min-width: 0; }
.rel-tile small { font-size: 10px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; color: var(--muted); }
.rel-tile.vazio { background: none; }
.rel-tile.vazio .equip-vazio { width: 30px; height: 30px; }
.rel-resumo { font-size: 13px; color: #c8f5c0; background: #1f3a2b; padding: 6px 10px; clip-path: var(--entalhe); }
.rel-slots { display: flex; flex-direction: column; gap: 6px; }
.rel-slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: var(--painel2); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--rc, var(--linha)); cursor: pointer; text-align: left; color: var(--tinta); }
.rel-slot > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.rel-slot small { color: var(--muted); font-size: 12px; }
.rel-slot.vazio { background: none; box-shadow: inset 0 0 0 2px var(--linha); }
.rel-slot.vazio .equip-vazio { width: 30px; height: 30px; flex: none; }
.bolsa { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile-cons { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border: 0; background: var(--linha-esc); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); cursor: pointer; color: var(--tinta); }
.tile-cons b { font-family: var(--f-display); font-size: 11px; }
.tile-cons small { font-size: 10px; color: var(--ouro); }
.tile-cons.on { box-shadow: inset 0 0 0 2px var(--ouro); }
.forja-linha { display: flex; align-items: center; gap: 10px; background: var(--painel2); padding: 8px 10px; clip-path: var(--entalhe); }
.forja-linha > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.forja-linha small { color: var(--muted); }
.escada { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; }
.escada i { color: var(--fraco); font-style: normal; font-family: var(--f-display); font-size: 11px; }
.degrau { font-family: var(--f-display); font-size: 10px; padding: 4px 6px; background: var(--linha-esc); color: var(--fraco); clip-path: var(--entalhe); }
.degrau.feito { color: var(--dc); }
.degrau.atual { background: var(--dc); color: #160f1d; font-weight: 700; }
.preparo { display: flex; flex-direction: column; gap: 6px; }
.chip-btn.cons { display: inline-flex; align-items: center; gap: 6px; }
.copa { box-shadow: inset 0 0 0 2px var(--ouro-esc), inset 0 -4px 0 rgba(0,0,0,.25); background: linear-gradient(180deg, #33281a, var(--painel) 40%); }
.chave { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-display); font-size: 11px; }
.chave span { padding: 4px 8px; background: var(--linha-esc); color: var(--fraco); clip-path: var(--entalhe); }
.chave span.atual { background: var(--ouro); color: var(--ouro-tx); }
.chave span.feito { color: var(--bom); }
.chave i { color: var(--fraco); font-style: normal; }
.lider { display: flex; align-items: center; gap: 12px; background: var(--linha-esc); padding: 8px; clip-path: var(--entalhe); }
.lider > div:last-child { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; }
.lider small { color: var(--muted); }
.retrato.chefe { background: radial-gradient(circle at 50% 70%, #5a2a1a, #1c1020 70%); padding: 4px; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--ruim); }
.mini.chefe { box-shadow: inset 0 0 0 2px var(--ruim); }
.fim-temp .premios, .premios-andar .premios { display: flex; flex-wrap: wrap; gap: 6px; }
.fim-temp .premios span, .premios-andar .premios span { display: flex; align-items: center; gap: 6px; background: var(--linha-esc); padding: 5px 9px; clip-path: var(--entalhe); font-weight: 600; }
.mov { font-family: var(--f-display); font-size: 12px; padding: 8px 10px; background: var(--linha-esc); clip-path: var(--entalhe); }
.mov.sobe { background: #1f3a2b; color: #a7f0a0; }
.mov.cai { background: #432026; color: #ffb3a8; }
.tabela tr.cai td:first-child { color: var(--ruim); }
.mk-copa { display: inline-block; width: 4px; height: 4px; margin-left: 3px; vertical-align: middle; background: var(--ouro); }
.destaque-ouro { box-shadow: inset 0 0 0 2px var(--ouro), inset 0 -4px 0 rgba(0,0,0,.25); }
.aviso { background: #3a2a10; color: #ffe4a8; padding: 8px 10px; clip-path: var(--entalhe); font-size: 14px; }
.aviso.ok { background: #1f3a2b; color: #b6f0ad; }
.centro { text-align: center; }
.campeao-novo { display: flex; align-items: center; gap: 12px; padding: 10px; background: linear-gradient(180deg, #4a3818, #2a2016); clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--ouro); animation: revela .5s steps(4); }
.campeao-novo > div { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; }
.campeao-novo b { color: var(--ouro); font-size: 16px; }
.campeao-novo small { color: #e9dfc9; }
.promo { display: flex; flex-direction: column; gap: 4px; padding: 10px; clip-path: var(--entalhe); }
.promo > b { font-family: var(--f-display); font-size: 16px; }
.promo.sobe { background: #1f3a2b; color: #b6f0ad; }
.promo.cai { background: #432026; color: #ffb3a8; }
.promo small { color: var(--tinta); }
.hud-time.compacto { gap: 4px; }
.hud-time.compacto .hud-u { padding: 4px 8px; }
.criador-btn { background: #3a2a10 !important; color: #ffe4a8 !important; box-shadow: inset 0 0 0 2px var(--ouro-esc) !important; }
.versao { align-self: center; border: 0; background: none; color: var(--fraco); font-family: var(--f-corpo); font-size: 12px; padding: 8px; cursor: default; }
.cri-sec { display: flex; flex-direction: column; gap: 8px; background: var(--painel2); padding: 10px; clip-path: var(--entalhe); }
.cri-sec h3 { font-size: 12px; color: var(--ouro); }
.cri-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cri-grade label { display: flex; flex-direction: column; gap: 3px; }
.lista-cri .chip-btn, .cri-sec .chip-btn[style] { box-shadow: inset 0 0 0 1px var(--rc); }
.lista-cri .chip-btn.on { box-shadow: inset 0 0 0 2px #fff; }
input[type=number] { width: 100%; min-width: 0; min-height: 40px; font-family: var(--f-corpo); font-size: 16px; background: var(--linha-esc); color: var(--tinta); border: 2px solid var(--linha); padding: 6px 8px; }
.vitrine { display: flex; justify-content: center; gap: 0; margin: -4px 0; }
.novidades .card { align-items: flex-start; }


/* ---------- Fase 3 ---------- */
.btn-est { align-self: flex-start; margin-top: 4px; }
.btn-som { margin-top: 3px; border: 0; background: var(--linha-esc); padding: 4px 6px; clip-path: var(--entalhe); cursor: pointer; display: grid; place-items: center; }
.torre-col { display: flex; flex-direction: column; gap: 3px; padding: 0 14px; }
.torre-teto { height: 14px; margin: 0 -8px 2px; background: var(--linha); clip-path: polygon(0 100%, 6% 55%, 14% 55%, 20% 0, 80% 0, 86% 55%, 94% 55%, 100% 100%); }
.andar { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; background-color: #2a2236; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--linha); font-size: 13px; background-image: linear-gradient(90deg, rgba(0,0,0,.16) 1px, transparent 1px); background-size: 14px 100%; }
.andar .an-num { font-family: var(--f-display); font-size: 13px; color: var(--muted); text-align: center; }
.andar .an-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.andar .an-fim { display: flex; gap: 3px; align-items: center; min-height: 14px; }
.andar.futuro { opacity: .5; }
.andar.feito .an-info, .andar.feito .an-num { color: var(--fraco); }
.ok-marca { font-style: normal; font-family: var(--f-display); font-size: 9px; color: var(--bom); }
.andar.atual { background-color: #3a2d1a; box-shadow: inset 0 0 0 2px var(--ouro); }
.andar.atual .an-num, .andar.atual .an-info { color: var(--ouro); font-weight: 600; }
.andar.guardiao { box-shadow: inset 0 0 0 2px var(--ruim); }
.andar.guardiao.atual { box-shadow: inset 0 0 0 2px var(--ouro), inset 0 0 0 4px var(--ruim); }
.andar-atual.guardiao { box-shadow: inset 0 0 0 2px var(--ruim), inset 0 -4px 0 rgba(0,0,0,.25); background: linear-gradient(180deg, #3a1a22, var(--painel) 45%); }
.mod-andar { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: #2a2040; clip-path: var(--entalhe); box-shadow: inset 0 0 0 2px var(--roxo); }
.mod-andar b { font-family: var(--f-display); font-size: 12px; color: #e2c8ff; }
.mod-andar small { color: var(--tinta); }
.premios-andar { display: flex; flex-direction: column; gap: 6px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--painel2); padding: 10px; clip-path: var(--entalhe); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .rot { width: auto; }
.kpi b { font-family: var(--f-display); font-size: 19px; color: var(--tinta); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }
.kpi small { color: var(--muted); font-size: 12px; }
.est-sec { display: flex; flex-direction: column; gap: 8px; }
.est-sec h3 { font-size: 12px; color: var(--ouro); }
.est-merc { display: flex; align-items: center; gap: 10px; }
.em-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

// Pesos de potencial conforme o nível da Taverna (move 2 pontos de F/D para A/S por nível)
function potPesos(nivelTaverna) {
  const sh = nivelTaverna - 1;
  const w = POTS.map((p) => POT_INFO[p].peso);
  const tiraF = Math.min(w[0], sh), tiraD = Math.min(w[1], sh);
  w[0] -= tiraF; w[1] -= tiraD;
  w[4] += Math.floor((tiraF + tiraD) / 2); w[5] += Math.ceil((tiraF + tiraD) / 2);
  return w;
}

// Regra de um andar: fixa para cada número (os 3 primeiros andares não têm regra; Guardiões sempre têm)
function modDoAndar(n) {
  if (n <= 3) return null;
  if (!TORRE.guardiao(n) && mulberry32(n * 7919 + 13)() < 0.3) return null;
  // passo 7 (primo com 11): andares seguidos nunca repetem a mesma regra
  return MODS_ANDAR[(n * 7 + Math.floor(n / MODS_ANDAR.length) * 3) % MODS_ANDAR.length];
}

function gradeVazia(w, h) { return Array.from({ length: h }, () => Array(w).fill('.')); }
// Desenha uma grade (com 1 px de borda para o contorno) num canvas
function gradeParaCanvas(g, pal, modo) {
  const H = g.length, W = g[0].length;
  const cv = document.createElement('canvas'); cv.width = W + 2; cv.height = H + 2;
  const ctx = cv.getContext('2d');
  const opaco = (x, y) => x >= 0 && y >= 0 && x < W && y < H && g[y][x] !== '.';
  for (let y = -1; y <= H; y++) for (let x = -1; x <= W; x++) {
    if (opaco(x, y)) {
      ctx.fillStyle = modo === 'branco' ? '#ffffff' : (pal[g[y][x]] || '#ff00ff');
      ctx.fillRect(x + 1, y + 1, 1, 1);
    } else if (opaco(x - 1, y) || opaco(x + 1, y) || opaco(x, y - 1) || opaco(x, y + 1)) {
      ctx.fillStyle = CONTORNO; ctx.fillRect(x + 1, y + 1, 1, 1);
    }
  }
  return cv;
}

const SIMB = {

function luminancia(hex) { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
const cacheBrasao = new Map();
function brasaoCanvas(b) {
  const key = `${b.cor1}|${b.cor2}|${b.simbolo}`;
  if (cacheBrasao.has(key)) return cacheBrasao.get(key);
  const g = gradeVazia(12, 12);
  const dentro = (x, y) => x >= 0 && y >= 0 && x < 12 && y < 12 && ESCUDO[y][x] === '#';
  for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
    if (!dentro(x, y)) continue;
    const borda = !dentro(x - 1, y) || !dentro(x + 1, y) || !dentro(x, y - 1) || !dentro(x, y + 1);
    g[y][x] = borda ? '2' : '1';
  }
  const simbCor = Math.abs(luminancia(b.cor1) - luminancia(b.cor2)) < 0.25 ? (luminancia(b.cor1) > 0.5 ? '3' : '4') : '2';
  (SIMB[b.simbolo] || SIMB.espada).forEach((row, j) => { for (let i = 0; i < 6; i++) if (row[i] === '#') g[2 + j][3 + i] = simbCor; });
  const cv = gradeParaCanvas(g, { 1: b.cor1, 2: b.cor2, 3: '#2b2233', 4: '#f4efe2' });
  cacheBrasao.set(key, cv); return cv;
}

/* ===================== MERCENÁRIOS E ITENS ===================== */
let STATE = null;
function novoId() { STATE.nextId = (STATE.nextId || 1) + 1; return STATE.nextId; }
const CABELO_PADRAO = { machadeiro: 2, lanceira: 0, arqueira: 2, piromante: 0, criomante: 5, clerica: 3, lamina: 0, bardo: 1, invocador: 0 };

function rolarTracos(pot) {
  const n = weighted([40, 45, 15]);
  const t = shuffle(TRACOS_POS.slice()).slice(0, n);
  if ((pot === 'F' || pot === 'D') && Math.random() < 0.3) {
    const neg = pick(TRACOS_NEG);
    if (t.length >= 2) t[1] = neg; else t.push(neg);
  }
  return t;
}
// Nome que ainda não está em uso na guilda nem na Taverna
function nomeLivre(evitar = []) {
  const usados = new Set([...(STATE.mercs || []).map((m) => m.nome), ...((STATE.taverna && STATE.taverna.ofertas) || []).map((m) => m.nome), ...evitar]);
  const livres = NOMES.filter((n) => !usados.has(n));

}

  const faixa = POT_INFO[pot].faixa;
  return CLASSES[cls].cresc.map(([lo, hi]) => Math.round((lo + (hi - lo) * rnd(faixa[0], faixa[1])) * 100) / 100);
}
function gerarMerc(cls, nivel, pot, evitar = []) {
  return {

    equip: { arma: null, armadura: null, amuleto: null }, pergaminhos: [], ascensoes: 0,

    pele: rint(0, 3), cabelo: CABELO_PADRAO[cls] != null && Math.random() < 0.5 ? CABELO_PADRAO[cls] : rint(0, 5),

}
// Campeão Lendário: base 25% maior, potencial mínimo A e habilidade própria
function gerarCampeao(id, nivel) {

const multTraco = (m, k) => m.tracos.reduce((a, t) => a * (TRACOS[t][k] || 1), 1);
const somaTraco = (m, k) => m.tracos.reduce((a, t) => a + (TRACOS[t][k] || 0), 0);

const ACEL_VIDA = 0.025;   // a VIDA cresce 2,5% mais rápido a cada nível (lutas não encurtam nos níveis altos)
function crescEfetivo(m) {
  const k = multExtra(m), L = m.nivel, bv = CLASSES[m.classe].base[0];

  return { vida: dVida * multTraco(m, 'vida') * k, atq: m.cresc[1] * multTraco(m, 'atq') * k, def: m.cresc[2] * multTraco(m, 'def') * k, agi: m.cresc[3] * multTraco(m, 'agi') * k };

  olhoTempestade: 'raio', esqueletos: 'invocar', hino: 'magia', gritoGuerra: 'magia', chuva: 'flecha', tempestadeFlechas: 'flecha', flechaVenenosa: 'flecha', eclipse: 'morte',
};
function somDoEvento(ev) {
  switch (ev.tipo) {
    case 'dano':
      if (ev.crit) { somTocar('critico'); if (ev.src && ev.src.team === 0 && ev.valor > ev.alvo.vidaMax * 0.12) vibrar(12); }
      else if (ev.escudo) somTocar('escudo');
      else somTocar(ev.valor > ev.alvo.vidaMax * 0.08 ? 'golpe' : 'golpeLeve');
      break;
    case 'esquiva': somTocar('esquiva'); break;
    case 'cura': if (!ev.pequeno) somTocar('cura'); break;
    case 'morte': somTocar('morte'); if (ev.u.team === 0 && !ev.u.invocacao) vibrar(35); break;
    case 'explosao': somTocar(ev.cor === 'meteoro' ? 'explosao' : 'fogo'); break;
    case 'bomba': case 'golens': somTocar('explosao'); break;
    case 'congelar': case 'estilhaco': somTocar('gelo'); break;
    case 'atordoar': somTocar('atordoar'); break;
    case 'raio': case 'raioCeu': somTocar('raio'); break;
    case 'flechada': case 'flechaCai': case 'adagaCai': somTocar('flecha'); break;
    case 'invocar': somTocar('invocar'); break;
    case 'renascer': somTocar('renascer'); break;
    case 'skill': somTocar(SKILL_SOM[ev.id] || 'skill'); break;
    case 'supremo': somTocar('supremo'); if (ev.u.team === 0) vibrar(50, true); break;
  }
}

/* ---- música das lutas: chiptune em lá menor (Am F C G), 132 bpm ---- */
const MUSICA = {
  bpm: 132,
  baixo: [45, 41, 48, 43],
  arpejo: [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]],
  melodia: [
    76, 0, 76, 0, 81, 0, 79, 76, 0, 74, 76, 0, 72, 0, 69, 0,
    72, 0, 72, 0, 77, 0, 76, 72, 0, 69, 72, 0, 74, 0, 0, 0,
    76, 0, 76, 0, 79, 0, 81, 79, 0, 76, 74, 0, 72, 0, 74, 0,
    71, 0, 74, 0, 79, 0, 0, 0, 74, 0, 71, 0, 74, 0, 76, 0,
  ],
};
const midiHz = (n) => 440 * Math.pow(2, (n - 69) / 12);
function tocarPasso(p, t) {
  const c = Som.ctx, atraso = Math.max(0, t - c.currentTime), canal = Som.mus, s = p % 16, compasso = Math.floor(p / 16) % 4;
  const passo = 60 / MUSICA.bpm / 4;
  if (s % 8 === 0) tom(110, 0.13, { tipo: 'sine', vol: 0.5, ate: 40, atraso, canal });
  if (s % 8 === 4) ruido(0.12, { vol: 0.22, freq: 1900, q: 0.8, atraso, canal });
  if (s % 2 === 1) ruido(0.03, { vol: 0.07, freq: 8000, filtro: 'highpass', atraso, canal });
  if (s % 2 === 0) tom(midiHz(MUSICA.baixo[compasso] + (s % 4 === 2 ? 12 : 0)), passo * 1.6, { tipo: 'triangle', vol: 0.32, atraso, canal });
  tom(midiHz(MUSICA.arpejo[compasso][s % 3] + 12), passo * 0.9, { vol: 0.035, atraso, canal });
  const m = MUSICA.melodia[p % 64];
  if (m) tom(midiHz(m), passo * 1.7, { vol: 0.075, atraso, canal });
}
function musicaIniciar() {
  if (!somAtivo() || !cfgSom().musica || Som.musica) return;
  const passo = 60 / MUSICA.bpm / 4;
  const M = { p: 0, prox: Som.ctx.currentTime + 0.08 };
  M.timer = setInterval(() => {
    if (!Som.ctx) return;
    while (M.prox < Som.ctx.currentTime + 0.15) { tocarPasso(M.p, M.prox); M.prox += passo; M.p = (M.p + 1) % 64; }
  }, 30);
  Som.musica = M;
}
function musicaParar() { if (Som.musica) { clearInterval(Som.musica.timer); Som.musica = null; } }

// Clima: partículas ambientes por cenário
function climaArena(dt) {
  const cen = Arena.cenario, W = ARENA.w, H = ARENA.h;
  if (cen === 'floresta') { if (Math.random() < dt * 6) particula(rnd(0, W), rnd(0, 30), rnd(8, 22), rnd(10, 22), rnd(4, 7), pick(['#7fb04f', '#e8a23b', '#c9772e']), { tipo: 'folha', g: 0, tam: 2 }); }
  else if (cen === 'vulcao') { if (Math.random() < dt * 10) particula(rnd(0, W), rnd(ARENA.chao, H), rnd(-4, 4), rnd(-26, -12), rnd(1.5, 3), pick(['#ff6a1f', '#ffd23f', '#ff9a3c']), { g: 0, tam: 1 }); }
  else if (cen === 'torre') { if (Math.random() < dt * 5) particula(rnd(0, W), rnd(ARENA.chao, H), rnd(-3, 3), rnd(-10, -4), rnd(2, 4), pick(['#bd86f5', '#efdcff']), { g: 0, tam: 1 }); }
  else if (cen === 'ruinas') { if (Math.random() < dt * 3) particula(rnd(0, W), rnd(20, H), rnd(4, 10), rnd(-3, 3), rnd(3, 5), '#c9c4b4', { g: 0, tam: 1 }); }
}

/* ============================ VFX DIRECIONAIS (Fase 4) ============================
   Efeitos "desenhados à mão" em pixel: cortes em meia-lua orientados pelo ângulo
   atacante→alvo, impactos, colunas de fogo, cristais de gelo, pilares sagrados,
   raios com brilho, rastros de investida e marcações no chão (telegraph). */
const dirDe = (a) => [Math.cos(a), Math.sin(a)];
function discoPixel(c, x, y, rx, ry, cor) {
  c.fillStyle = cor; x = Math.round(x); y = Math.round(y);
  for (let j = -Math.ceil(ry); j <= Math.ceil(ry); j++) {
    const k = 1 - (j * j) / (ry * ry || 1); if (k <= 0) continue;
    const w = Math.round(rx * Math.sqrt(k)); c.fillRect(x - w, y + j, w * 2 + 1, 1);
  }
}
// pixel "gordo" com contorno opcional
function pontoFx(c, x, y, cor, tam = 2) { c.fillStyle = cor; c.fillRect(Math.round(x - tam / 2), Math.round(y - tam / 2), tam, tam); }

/* ---- disparadores (chamados pelos eventos) ---- */
function fxCorte(u, alvo, forte) {
  const ang = Math.atan2((alvo.y - 18) - (u.y - 18), alvo.x - u.x);

    };
  };
  const S = STATE.stats;
  const p = {
    n: ++S.partidasN, quando: Date.now(), tipo: ctx.tipo, rival: ctx.rival.nome, andar: ctx.rival.andar || null,
    seed: reg.seed, regras: reg.regras, vit, vencedor: b.vencedor, tempo: Math.round(b.t * 10) / 10, passos: b.n,
    criador: !!b.criador, times: res.unidades.map((t) => t.map(lut)),
  };

  if (!b.criador) { reg.replay.entradas = b.entradas.map((e) => ({ ...e })); p.replay = reg.replay; }
  STATE.partidas.push(p);
  while (STATE.partidas.length > PARTIDAS_MAX) STATE.partidas.shift();
  STATE.partidas.forEach((x, i) => { if (i < STATE.partidas.length - REPLAYS_MAX) delete x.replay; });
  // teto de tamanho (o save na conta aceita ~234 KB): times grandes descartam primeiro os dados de reprodução mais antigos
  while (JSON.stringify(STATE.partidas).length > PARTIDAS_BYTES) {
    const velho = STATE.partidas.find((x) => x.replay && x !== p);
    if (velho) delete velho.replay; else if (STATE.partidas.length > 1) STATE.partidas.shift(); else break;

  S.seqAtual = vit ? S.seqAtual + 1 : 0;

  if (vit && ctx.rival.lider) S.lideresVencidos[ctx.rival.lider] = (S.lideresVencidos[ctx.rival.lider] || 0) + 1;
  // melhores da temporada: meus heróis em toda luta; rivais só quando são guildas da liga
  somarHerois(res.unidades[0], STATE.guilda.nome, true, vit);

// O que aconteceu na tela, no mesmo formato de assinaturaLuta
const assinaturaRegistro = (p) => ({ vencedor: p.vencedor, passos: p.passos, lutadores: p.times.flat().map((u) => [u.uid, u.dano, u.cura, u.rec, u.ab, u.mo]) });
// Reproduz uma partida do registro e compara com o que aconteceu na tela
function conferirPartida(p) {
  if (!p.replay) return p.criador ? 'criador' : 'sem-dados';
  const r = reproduzirPartida(p);

/* ---- melhores da temporada ---- */
function recTemporada() {
  const t = STATE.liga ? STATE.liga.temporada : 1;
  if (!STATE.temporadaRec || STATE.temporadaRec.t !== t) STATE.temporadaRec = { t, herois: {} };
  return STATE.temporadaRec;
}
function somarHerois(unidades, guilda, meu, venceu) {
  const lista = unidades.filter((u) => u.merc && !u.chefe && !u.invocacao);
  if (!lista.length) return;
  const R = recTemporada(), mvp = mvpDe(lista);
  for (const u of lista) {
    const k = (meu ? 'm' : 'r') + u.merc.id;
    const h = R.herois[k] || (R.herois[k] = { meu, guilda, nome: u.nome, cls: u.cls, look: u.look, lutas: 0, vit: 0, dano: 0, cura: 0, abates: 0, mortes: 0, mvp: 0 });
    h.nome = u.nome; h.look = u.look; h.guilda = guilda;
    h.lutas++; if (venceu) h.vit++;
    h.dano += Math.round(u.dano); h.cura += Math.round(u.cura); h.abates += u.abates; h.mortes += u.mortes;
    if (u === mvp) h.mvp++;

}
// Lutas entre duas guildas rivais (simuladas na rodada da liga) também contam
function somarLutaRivais(bt, res, nomeA, nomeB) {
  somarHerois(res.unidades[0], nomeA, false, bt.vencedor === 0);
  somarHerois(res.unidades[1], nomeB, false, bt.vencedor === 1);
}
const kdaDe = (h) => h.abates / Math.max(1, h.mortes);
const CATEGORIAS_TEMPORADA = [
  { id: 'mvp', nome: 'MVP', valor: (h) => h.mvp, txt: (h) => `${fmt(h.mvp)} ${h.mvp === 1 ? 'vez' : 'vezes'}` },
  { id: 'abates', nome: 'Mais abates', valor: (h) => h.abates, txt: (h) => fmt(h.abates) },
  { id: 'kda', nome: 'Melhor KDA', valor: (h) => (h.lutas >= 3 ? kdaDe(h) : -1), txt: (h) => `${fmt1(kdaDe(h))} (${fmt(h.abates)}/${fmt(h.mortes)})`, dica: 'abates ÷ quedas, mín. 3 lutas' },
  { id: 'dano', nome: 'Mais dano', valor: (h) => h.dano, txt: (h) => fmtCompacto(h.dano) },
  { id: 'cura', nome: 'Mais cura', valor: (h) => h.cura, txt: (h) => fmtCompacto(h.cura) },
];
// Ranking de uma categoria: os 3 primeiros e, se nenhum for meu, o meu melhor com a posição
function rankingTemporada(cat, funcao) {
  const R = STATE.temporadaRec;
  const lista = R ? Object.values(R.herois).filter((h) => (funcao === 'todas' || funcaoDe(h.cls) === funcao) && cat.valor(h) > 0) : [];
  lista.sort((a, b) => cat.valor(b) - cat.valor(a) || b.dano - a.dano);
  const top = lista.slice(0, 3).map((h, i) => ({ h, pos: i + 1 }));
  if (!top.some((x) => x.h.meu)) { const i = lista.findIndex((h) => h.meu); if (i >= 0) top.push({ h: lista[i], pos: i + 1 }); }
  return top;
}
/* ============================ SAVE NA CONTA (Fase 4.1) ============================
   Quando o jogo roda dentro do Claude, com a pessoa conectada e com permissão de escrita,
   o progresso também fica guardado na conta dela: um documento privado em
   data/users/<id>/save (nem o dono do jogo consegue ler). Assim o progresso
   sobrevive a limpar o navegador e acompanha a pessoa entre aparelhos.
   Sem isso (fora do Claude, sem login ou só com permissão de leitura), o jogo
   segue salvando neste aparelho, como sempre. */
const Nuvem = {
  estado: 'local',            // local | conectando | ativa | sem-permissao
  db: null, ref: null, sessao: Math.random().toString(36).slice(2, 10),
  localEm: 0,                 // ultimaVez do save local ao abrir (antes de esta visita mexer nele)
  sujo: 0, enviando: false, pausada: false, ultimoEnvio: 0, ultimoTexto: '', ultimaNuvem: 0,
  erro: '', cancelar: null, pendente: null, avisoDepois: null,
};
const TAM_MAX_NUVEM = 240000;   // o documento aceita até 256 KiB
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const lutaRolando = () => !!(Luta && Luta.ativo);

function resumoSave(st) {
  const n = Math.max(1, st.mercs.length);
  return {
    guilda: st.guilda && st.guilda.nome ? st.guilda.nome : 'Guilda', divisao: st.divisao | 0,
    temporada: st.liga ? st.liga.temporada : 1, rodada: st.liga ? st.liga.rodada | 0 : 0, ouro: Math.floor(st.ouro || 0), mercs: st.mercs.length,
    nivel: Math.round(st.mercs.reduce((a, m) => a + (m.nivel || 1), 0) / n), torre: st.torre ? st.torre.recorde | 0 : 0,
  };
}
function docParaSave(snap) {
  if (!snap || !snap.exists) return null;
  const d = snap.data() || {};
  if (typeof d.save !== 'string') return null;
  try {
    const st = validarSave(JSON.parse(d.save));
    return { st, ultimaVez: +d.ultimaVez || st.ultimaVez || 0, criadoEm: +d.criadoEm || st.criadoEm || 0, sessao: d.sessao || '' };
  } catch (e) { return null; }
}

// Liga a nuvem depois que o jogo já abriu com o save local (nunca atrasa a primeira tela)
async function iniciarNuvem() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  Nuvem.estado = 'conectando'; atualizarStatusNuvem();
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { /* segue só neste aparelho */ }
  const uid = user ? await user.id() : null;
  const podeEscrever = user ? await user.can('data.write') : null;
  if (!db || !uid || podeEscrever === false) { Nuvem.estado = podeEscrever === false && uid ? 'sem-permissao' : 'local'; atualizarStatusNuvem(); return; }
  Nuvem.db = db;
  Nuvem.ref = db.doc(`data/users/${uid}/save`);
  let snap = null;
  for (let t = 0; t < 2 && !snap; t++) {
    try { snap = await Nuvem.ref.get(); }
    catch (e) { if (t === 0 && e && e.code === 'unavailable') await esperar(700 + Math.random() * 900); else break; }
  }
  if (!snap) { Nuvem.estado = 'local'; atualizarStatusNuvem(); return; }
  while (lutaRolando()) await esperar(1000);   // não troca o jogo no meio de uma luta
  Nuvem.estado = 'ativa';
  await reconciliarNuvem(docParaSave(snap));
  if (Nuvem.estado === 'ativa') escutarNuvem();
  atualizarStatusNuvem();
}

// Decide entre o save deste aparelho e o da conta
async function reconciliarNuvem(remoto) {
  if (!remoto) { if (STATE) { await enviarNuvem(true); avisarNuvemAtiva(); } return; }   // conta vazia: sobe o deste aparelho
  Nuvem.ultimaNuvem = remoto.ultimaVez;
  if (!STATE) { fecharTodosModais(); entrarNoJogo(remoto.st); Nuvem.ultimoTexto = ''; toast('Progresso carregado da sua conta.', 'ok'); return; }
  if (remoto.criadoEm && remoto.criadoEm === STATE.criadoEm) {   // mesma guilda
    if (remoto.ultimaVez > Nuvem.localEm + 1500) { usarRemoto(remoto, 'Progresso atualizado com o que estava salvo na sua conta.'); return; }
    await enviarNuvem(true); avisarNuvemAtiva(); return;
  }
  perguntarQualSave(remoto);                                      // guildas diferentes: a pessoa escolhe
}
function usarRemoto(remoto, msg) {
  fecharTodosModais();
  entrarNoJogo(remoto.st);
  Nuvem.ultimoTexto = ''; Nuvem.pausada = false; Nuvem.pendente = null; Nuvem.ultimaNuvem = remoto.ultimaVez;
  if (msg) toast(msg, 'ok');
}
function avisarNuvemAtiva() {

  if (!avisado && Nuvem.estado === 'ativa') toast('Seu progresso agora também fica salvo na sua conta Claude.', 'ok');
}

function cartaoSave(titulo, r, quando, act) {
  const div = DIVISOES[clamp(r.divisao | 0, 0, DIVISOES.length - 1)];
  return `<div class="card"><div class="card-corpo"><span class="rot">${titulo}</span><b>${esc(r.guilda)}</b>
    <small>Divisão ${div.nome} · Temporada ${r.temporada}${r.rodada ? `, rodada ${r.rodada}` : ''} · ${fmt(r.ouro || 0)} ouro</small>
    <small>${r.mercs} mercenários (nível médio ${r.nivel})${r.torre ? ` · Torre: andar ${r.torre}` : ''}</small>
    <small>Salvo em ${new Date(quando).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</small></div>

}
function perguntarQualSave(remoto) {
  Nuvem.pendente = remoto; Nuvem.pausada = true;
  abrirModal(`<h2>Dois progressos encontrados</h2>
    <p class="dica">Sua conta Claude e este aparelho têm guildas diferentes. Escolha qual continuar: o outro será substituído.</p>
    <div class="lista">${cartaoSave('Na sua conta', resumoSave(remoto.st), remoto.ultimaVez, 'nuvem-usar-conta')}${cartaoSave('Neste aparelho', resumoSave(STATE), Nuvem.localEm || STATE.ultimaVez, 'nuvem-usar-aparelho')}</div>`, { semFechar: true, dados: { nuvem: true } });
}

// Outra aba ou aparelho salvou depois desta: pausa os envios e pergunta
function escutarNuvem() {
  if (Nuvem.cancelar || !Nuvem.ref) return;
  Nuvem.cancelar = Nuvem.ref.onSnapshot((snap) => {
    if (!snap.exists || snap.metadata.hasPendingWrites || !STATE) return;
    const d = snap.data() || {};
    if (!d.sessao || d.sessao === Nuvem.sessao || (+d.ultimaVez || 0) <= Nuvem.ultimaNuvem) return;
    Nuvem.ultimaNuvem = +d.ultimaVez || 0;
    Nuvem.pausada = true;
    Nuvem.avisoDepois = snap;
    if (!lutaRolando()) mostrarAvisoOutroAparelho();
  }, () => { Nuvem.cancelar = null; });
}
function mostrarAvisoOutroAparelho() {
  const snap = Nuvem.avisoDepois; Nuvem.avisoDepois = null;
  const remoto = docParaSave(snap); if (!remoto) { Nuvem.pausada = false; return; }
  Nuvem.pendente = remoto;
  if (modalCom('nuvem')) return;
  abrirModal(`<h2>Jogo salvo em outro lugar</h2>
    <p class="dica">Seu progresso foi salvo em outro aparelho ou aba depois desta. Para não perder nada, escolha com qual continuar.</p>
    <div class="lista">${cartaoSave('O mais recente (outro aparelho)', resumoSave(remoto.st), remoto.ultimaVez, 'nuvem-usar-conta')}${cartaoSave('Esta aba', resumoSave(STATE), STATE.ultimaVez, 'nuvem-usar-aparelho')}</div>`, { semFechar: true, dados: { nuvem: true } });
}

// Envio: logo depois de ações (com folga de 8 s) e, no ócio, no máximo a cada 90 s
function marcarNuvem(importante) { if (Nuvem.estado === 'ativa') Nuvem.sujo = Math.max(Nuvem.sujo, importante ? 2 : 1); }
function cicloNuvem() {
  if (Nuvem.avisoDepois && !lutaRolando()) mostrarAvisoOutroAparelho();
  if (Nuvem.estado !== 'ativa' || Nuvem.pausada || Nuvem.enviando || !STATE || !Nuvem.sujo) return;
  const desde = Date.now() - Nuvem.ultimoEnvio;
  if ((Nuvem.sujo >= 2 && desde >= 8000) || desde >= 90000) enviarNuvem();
}
async function enviarNuvem(forcar = false) {
  if (Nuvem.estado !== 'ativa' || !STATE || Nuvem.enviando || (Nuvem.pausada && !forcar)) return false;
  const texto = JSON.stringify(STATE);
  if (texto === Nuvem.ultimoTexto) { Nuvem.sujo = 0; return true; }
  if (texto.length > TAM_MAX_NUVEM) { Nuvem.erro = 'grande'; Nuvem.sujo = 0; atualizarStatusNuvem(); return false; }
  const sujoAntes = Nuvem.sujo;
  Nuvem.enviando = true; Nuvem.sujo = 0;
  try {
    await Nuvem.ref.set({ v: 1, save: texto, ultimaVez: STATE.ultimaVez, criadoEm: STATE.criadoEm, sessao: Nuvem.sessao, resumo: resumoSave(STATE) });
    Nuvem.ultimoTexto = texto; Nuvem.ultimoEnvio = Date.now(); Nuvem.ultimaNuvem = STATE.ultimaVez; Nuvem.erro = ''; Nuvem.pausada = false;
    return true;
  } catch (e) {

    else if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(code)) Nuvem.estado = 'local';
    else { Nuvem.sujo = Math.max(Nuvem.sujo, sujoAntes || 1); Nuvem.ultimoEnvio = Date.now(); Nuvem.erro = code; }   // tenta de novo mais tarde
    return false;
  } finally {
    Nuvem.enviando = false;

  }
}
function apagarNuvem() {
  if (Nuvem.estado !== 'ativa' || !Nuvem.ref) return;
  Nuvem.ultimoTexto = ''; Nuvem.sujo = 0;
  Nuvem.ref.delete().catch(() => { /* fica para o próximo envio sobrescrever */ });
}

function textoStatusNuvem() {
  switch (Nuvem.estado) {
    case 'ativa': {
      const min = Nuvem.ultimoEnvio ? Math.floor((Date.now() - Nuvem.ultimoEnvio) / 60000) : null;
      const quando = min === null ? 'aguardando a primeira cópia' : min < 1 ? 'última cópia agora há pouco' : `última cópia há ${min} min`;
      return `Salvo neste aparelho e na sua conta Claude (${quando}). Você pode continuar em outro aparelho entrando com a mesma conta.${Nuvem.erro === 'grande' ? ' O save ficou grande demais para a conta: use Exportar save.' : ''}`;
    }
    case 'conectando': return 'Salvo neste aparelho. Conectando à sua conta Claude…';
    case 'sem-permissao': return 'Salvo neste aparelho. Este link não permite guardar o progresso na sua conta, então exporte o código de vez em quando para não perder.';

/* ============================ INTERFACE: BASE ============================ */
const UI = {

/* ---- canvases de pixel no DOM ---- */
const PROP_RETRATO = RETRATO.h / RETRATO.w;
// Na interface os personagens ficam de frente (vista 'frente'); use data-vista="lado" para o perfil clássico.
const canvasLook = (look, w, extra = '') => `<canvas class="px" data-look="${look}" ${/data-vista/.test(extra) ? '' : 'data-vista="frente"'} width="${RETRATO.w}" height="${RETRATO.h}" style="width:${w}px;height:${Math.round(w * PROP_RETRATO)}px" ${extra} aria-hidden="true"></canvas>`;
const canvasBrasao = (b, tam) => `<canvas class="px" data-brasao="${b.cor1}|${b.cor2}|${b.simbolo}" width="14" height="14" style="width:${tam}px;height:${tam}px" aria-hidden="true"></canvas>`;
const canvasIcone = (nome, tam, cores) => `<canvas class="px" data-icone="${nome}"${cores ? ` data-cores='${JSON.stringify(cores)}'` : ''} width="12" height="12" style="width:${tam}px;height:${tam}px" aria-hidden="true"></canvas>`;
function desenharEm(cv, src) {
  if (cv.width !== src.width) cv.width = src.width;
  if (cv.height !== src.height) cv.height = src.height;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.clearRect(0, 0, cv.width, cv.height); c.drawImage(src, 0, 0);
}
function hidratar(raiz = document) {
  $$('canvas[data-look]', raiz).forEach((cv) => desenharEm(cv, retrato(cv.dataset.look, 0, cv.dataset.vista || 'lado')));
  $$('canvas[data-brasao]', raiz).forEach((cv) => { const [cor1, cor2, simbolo] = cv.dataset.brasao.split('|'); desenharEm(cv, brasaoCanvas({ cor1, cor2, simbolo })); });
  $$('canvas[data-icone]', raiz).forEach((cv) => {
    const src = iconeCanvas(cv.dataset.icone, cv.dataset.cores ? JSON.parse(cv.dataset.cores) : null);
    desenharEm(cv, src);
    const w = parseFloat(cv.style.width); if (src.width !== src.height) cv.style.height = `${Math.round(w * src.height / src.width)}px`;
  });
}
// Respiração dos personagens na interface (4 quadros de "idle", fora de fase entre si)
let frameAnim = 0;
function animarSprites() {
  frameAnim = (frameAnim + 1) % QUADROS_POR_ANIM.idle;
  $$('canvas[data-look]:not([data-parado])').forEach((cv, i) => desenharEm(cv, retrato(cv.dataset.look, (frameAnim + i) % QUADROS_POR_ANIM.idle, cv.dataset.vista || 'lado')));
}

/* ---- toasts e modais ---- */
function toast(msg, tipo = '') {

function abrirModal(html, opts = {}) {

// Redesenha os modais abertos que mostram dados vivos (ficha, forja, item, criador…)
function atualizarModais() {
  for (const w of [...UI.modais]) {
    const d = w.dados;

/* ============================ INTERFACE: BATALHA ============================ */
function iniciarLuta(ctx) {
  ajustarTime();
  if (timeMercs().length < tamanhoTime()) { toast(`Monte um time com ${tamanhoTime()} mercenários no Elenco.`, 'erro'); UI.aba = 'elenco'; render(); return; }
  const preparo = preparoAtivo();
  ctx.usados = consumirPreparo();
  let A, B, opts = {};
  if (ctx.tipo === 'torre') ({ A, B, opts } = ladosTorre(preparo));
  else { A = ladoJogador(preparo); B = ladoDeGuilda(ctx.rival, multAdversario()); }
  salvar();
  const seed = (Math.random() * 1e9) | 0, optsLuta = { modoAuto: STATE.config.auto, ...opts };
  const reg = prepararRegistro(A, B, optsLuta, seed);   // retrato dos lados antes da luta, para o registro
  const b = criarBatalha(A, B, { ...optsLuta, seed });
  Luta = { b, ctx, reg, vel: STATE.config.vel, pausado: false, rodando: false, acc: 0, ultimo: 0, fimT: 0, terminou: false, raf: 0, ativo: true };
  montarTelaLuta(b);
  $('#luta').hidden = false; $('#app').hidden = true; $('#abas').hidden = true; $('#tutorial').hidden = true;
  window.scrollTo(0, 0);
  const cv = $('#arena');
  prepararArena(cv, b, cenarioDaLuta(ctx));
  Arena.aoSupremo = (u) => mostrarBanner('SUPREMO!', `${u.nome} · ${nomeHabilidade(u.skill.id)}`);
  Arena.aoEvento = eventoNaTela;
  cv.addEventListener('pointerdown', tocarArena);
  Luta.raf = requestAnimationFrame(loopLuta);
  contagem(['3', '2', '1', 'Lute!'], () => {
    Luta.rodando = true;
    musicaIniciar();
    const md = ctx.tipo === 'torre' ? modDoAndar(ctx.rival.andar) : null;
    if (ctx.rival.lider) { const Ld = LIDERES.find((l) => l.id === ctx.rival.lider); mostrarBanner(Ld.nome, Ld.desc); }
    else if (ctx.rival.guardiao) mostrarBanner(ctx.rival.mercs[0].nome, md ? `Guardião da Torre · ${md.nome}` : 'Guardião da Torre');
    else if (md) mostrarBanner(md.nome, md.desc);
    else if (ctx.usados.length) mostrarBanner('Preparo', ctx.usados.map((c) => CONSUMIVEIS[c].nome).join(' · '));
  });
}

function loopLuta(ts) {
  if (!Luta || !Luta.ativo) return;
  const dt = Math.min(0.1, Luta.ultimo ? (ts - Luta.ultimo) / 1000 : 0);
  Luta.ultimo = ts;
  const b = Luta.b;
  if (Luta.rodando && !Luta.pausado) {
    if (!b.fim) {
      if (Arena.pausa > 0) Arena.pausa -= dt;
      else {
        Luta.acc += dt * Luta.vel;
        let n = 0;
        while (Luta.acc >= DT && n < 12) { passo(b); processarEventos(b); Luta.acc -= DT; n++; if (b.fim) break; }
      }
    } else {
      Luta.fimT += dt;
      if (Luta.fimT > (Arena.lentaTotal ? 1.3 + Arena.lentaTotal : 1.3) && !Luta.terminou) { Luta.terminou = true; finalizarLuta(); }
    }
    const lenta = Arena.lenta > 0;

function finalizarLuta() {
  const b = Luta.b, ctx = Luta.ctx;
  const res = resumoBatalha(b);
  const vit = res.vencedor === 0;
  const nivelRival = ctx.rival.mercs.reduce((s, m) => s + m.nivel, 0) / ctx.rival.mercs.length;
  const fator = ctx.tipo === 'amistoso' ? ECO.amistosoRec : ctx.tipo === 'copa' ? 1.5 : ctx.tipo === 'torre' ? (vit ? 1 : 0.5) : 1;
  const xp = Math.round((ECO.xpBase + ECO.xpPorNivel * nivelRival) * (vit ? 1 : ECO.xpDerrota) * fator);
  const ouro = ctx.tipo === 'torre' ? 0 : Math.round((ECO.ouroBase + ECO.ouroPorNivel * nivelRival) * (vit ? 1 : ECO.ouroDerrota) * fator * DIFICULDADES[STATE.config.dif].rec * (1 + somaReliquia('ouro')));
  ganharOuro(ouro);
  const subidas = [];
  for (const u of res.unidades[0]) { const m = mercPorId(u.merc.id); if (!m) continue; const s = darXp(m, xp); if (s) subidas.push(s); }
  const nv = Math.max(1, Math.round(nivelMedioTime()));
  let drop = null, copa = null, torre = null;
  STATE.stats.lutas++; if (vit) STATE.stats.vitorias++;
  if (tutorialAtivo() && STATE.tutorial < TUT_FIM) STATE.tutorial++;   // cada luta do tutorial libera um menu
  const mvp = registrarEstatisticas(b, res, vit);
  registrarPartida(b, res, ctx, vit, mvp, Luta.reg);
  if (ctx.tipo === 'torre') {
    torre = registrarAndar(vit);
    if (torre.bau >= 0) drop = darDrop(rolarRaridade(sorteGuilda(), torre.bau), nv);
  } else if (ctx.tipo === 'liga') {
    registrarRodada(vit, res.abates[0], res.abates[1]);
    if (vit && Math.random() < ECO.chanceBau) drop = darDrop(rolarRaridade(sorteGuilda()), nv);
  } else if (ctx.tipo === 'copa') {
    copa = registrarCopa(vit);
    if (copa.bauMin >= 0) drop = darDrop(rolarRaridade(sorteGuilda(), copa.bauMin), nv);
  } else {
    STATE.amistoso = null;
    if (vit && Math.random() < ECO.chanceBau * fator) drop = darDrop(rolarRaridade(sorteGuilda()), nv);
  }
  STATE.taverna.lutas++;
  let renovou = false;
  if (STATE.taverna.lutas >= ECO.lutasRenovar) { renovarTaverna(false); renovou = true; }
  salvar();
  musicaParar();
  mostrarResultado({ vit, res, xp, ouro, subidas, drop, ctx, renovou, copa, torre, mvp });
}

function abrirCriador() { abrirModal(htmlCriador(), { dados: { criador: true } }); }
const lerNum = (id, padrao = 0) => { const v = Math.floor(Number(($('#' + id) || {}).value)); return Number.isFinite(v) ? v : padrao; };
function acaoCriador(el) {
  const op = el.dataset.op, v = el.dataset.v, U = UI.criador, C = STATE.criador;
  const m = mercPorId(U.merc);
  let msg = '';
  switch (op) {
    case 'ouro': STATE.ouro += +v; msg = `+${fmt(+v)} ouro`; break;
    case 'emb': STATE.emblemas += +v; msg = `+${v} emblemas`; break;
    case 'ouro-def': STATE.ouro = Math.max(0, lerNum('cri-ouro', STATE.ouro)); msg = 'Ouro definido'; break;
    case 'emb-def': STATE.emblemas = Math.max(0, lerNum('cri-emb', STATE.emblemas)); msg = 'Emblemas definidos'; break;
    case 'sorte': C.sorteMult = +v; msg = `Sorte ×${v}`; break;
    case 'tempo': C.tempoMult = +v; msg = `Ócio ×${v}`; break;
    case 'avancar': {
      const r = aplicarTempo(+v);
      for (const e of STATE.expedicoes) { e.fim -= +v * 60000; e.inicio -= +v * 60000; }
      STATE.sabedoriaAte = Math.max(0, (STATE.sabedoriaAte || 0) - +v * 60000);
      msg = `+${fmt(r.ouro)} ouro no cofre e +${fmt(r.xp)} XP`; break;
    }
    case 'expedicoes': for (const e of STATE.expedicoes) e.fim = Math.min(e.fim, Date.now()); msg = 'Expedições prontas'; break;
    case 'merc-aplicar': {
      if (!m) return;
      m.ascensoes = clamp(lerNum('cri-asc', m.ascensoes), 0, 2);
      m.nivel = clamp(lerNum('cri-nivel', m.nivel), 1, 30);
      if (m.nivel > nivelMax(m)) m.ascensoes = m.nivel > 20 ? 2 : 1;
      m.xp = 0;
      m.bonusCriador = { vida: lerNum('cri-b-vida'), atq: lerNum('cri-b-atq'), def: lerNum('cri-b-def'), agi: lerNum('cri-b-agi') };
      while (m.pergaminhos.length > slotsPergaminho(m)) devolverAoInventario(m.pergaminhos.pop());
      msg = `${m.nome} atualizado`; break;
    }
    case 'pot': if (m) { m.pot = v; m.cresc = rolarCresc(m.classe, v); msg = `Potencial ${v}`; } break;
    case 'traco': if (m) { m.tracos = m.tracos.includes(v) ? m.tracos.filter((t) => t !== v) : [...m.tracos, v]; } break;
    case 'it-tipo': U.tipo = v; U.unico = null; break;
    case 'it-rar': U.raridade = +v; break;
    case 'it-unico': U.unico = v || null; break;
    case 'it-criar': {
      if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; }
      U.nivel = clamp(lerNum('cri-it-nivel', U.nivel), 1, 30);
      const it = gerarItem(U.raridade, U.nivel, U.tipo);
      if (U.raridade === 4 && U.unico) it.unico = U.unico;
      STATE.inventario.push(it); msg = `${it.nome} criado`; break;
    }
    case 'perg-sel': U.perg = v; break;
    case 'rel-sel': U.rel = v; break;
    case 'perg-criar': if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; } STATE.inventario.push(gerarPergaminho(PERGAMINHOS[U.perg].r, U.perg)); msg = 'Pergaminho criado'; break;
    case 'rel-criar': if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; } STATE.inventario.push(gerarReliquia(RELIQUIAS[U.rel].r, U.rel)); msg = 'Relíquia criada'; break;
    case 'cons-todos': for (const k in CONSUMIVEIS) STATE.consumiveis[k] = (STATE.consumiveis[k] || 0) + 5; msg = '+5 de cada consumível'; break;
    case 'campeao': {
      if (STATE.mercs.length >= limiteElenco()) { toast('Elenco cheio.', 'erro'); return; }
      const nm = ajustarAscPorNivel(gerarCampeao(v, nivelRecruta()));
      receberCampeao(nm); msg = `${nm.nome} entrou para a guilda!`; break;
    }
    case 'liga-vencer': {
      if (STATE.liga.fase !== 'liga') return;
      registrarRodada(true, tamanhoTime(), 0); msg = 'Rodada vencida'; break;
    }
    case 'liga-fim': {
      while (STATE.liga.fase === 'liga') registrarRodada(true, tamanhoTime(), 0);
      msg = `Liga encerrada em ${STATE.liga.pos}º`; break;
    }
    case 'torre-mais': STATE.torre.recorde += +v; STATE.torre.inimigo = null; msg = `Recorde: andar ${STATE.torre.recorde}`; break;
    case 'torre-zero': STATE.torre.recorde = 0; STATE.torre.inimigo = null; msg = 'Recorde zerado'; break;
    case 'tributo-reset': STATE.torre.tributoDia = ''; msg = 'Tributo liberado'; break;
    case 'div': {
      STATE.divisao = clamp(+v, 0, DIVISOES.length - 1);
      preencherTime(); ajustarReliquias();
      novaTemporada(STATE.liga.temporada);
      STATE.amistoso = null; msg = `Divisão ${divAtual().nome}`; break;
    }
    case 'esconder': C.liberado = false; UI.toquesVersao = 0; salvar(); fecharTodosModais(); render(); toast('Modo Criador escondido. 7 toques na versão trazem de volta.'); return;
    default: return;
  }
  if (!['it-tipo', 'it-rar', 'it-unico', 'perg-sel', 'rel-sel'].includes(op)) C.usado = true;
  if (msg) toast(msg, 'ok');
  aposMudanca();
}

/* ============================ INTERFACE: AÇÕES ============================ */
function aposMudanca() { salvar(); render(); atualizarModais(); }
const avisoElencoCheio = () => (STATE.construcoes.acampamento < CONSTRUCOES.acampamento.max ? 'Elenco cheio. Venda alguém ou suba o Acampamento para abrir vagas.' : 'Elenco cheio. Venda alguém para abrir vaga.');
const topoModal = () => UI.modais[UI.modais.length - 1];
const MSG_RESULTADO = {
  cheio: 'Inventário cheio.', papel: 'Esse pergaminho não serve para o papel dele.', repetido: 'Ele já tem esse pergaminho.',
  repetida: 'Já há uma relíquia igual equipada.', ouro: 'Ouro insuficiente.', emblemas: 'Emblemas insuficientes.', nivel: 'Nível insuficiente.',
};
const ACOES = {
  'fechar-modal': () => fecharModal(),
  aba: (el) => { UI.aba = el.dataset.id; window.scrollTo(0, 0); render(); },
  coletar: () => {
    const v = Math.floor(STATE.cofre); if (v < 1) return;
    ganharOuro(v); STATE.cofre -= v; salvar(); somTocar('moeda'); toast(`+${fmt(v)} ouro`, 'ouro'); render();
  },
  melhorar: (el) => {
    const id = el.dataset.id, custo = custoMelhoria(id);
    if (STATE.ouro < custo || STATE.construcoes[id] >= nivelMaxConstrucao(id)) return;
    STATE.ouro -= custo; STATE.construcoes[id]++; somTocar('construir');
    toast(`${CONSTRUCOES[id].nome} subiu para o nível ${STATE.construcoes[id]}!`, 'ok'); aposMudanca();
  },

  /* --- elenco e ficha --- */
  'abrir-merc': (el) => abrirFicha(mercPorId(+el.dataset.id), 'elenco'),
  'ver-oferta': (el) => abrirFicha(STATE.taverna.ofertas.find((m) => m.id === +el.dataset.id), 'oferta'),
  'ver-pendente': () => abrirFicha(STATE.campeaoPendente, 'pendente'),
  recrutar: (el) => {
    const m = STATE.taverna.ofertas.find((o) => o.id === +el.dataset.id); if (!m) return;
    if (STATE.mercs.length >= limiteElenco()) { toast(avisoElencoCheio(), 'erro'); return; }
    if (STATE.ouro < precoMerc(m)) { toast('Ouro insuficiente.', 'erro'); return; }
    STATE.ouro -= precoMerc(m);
    STATE.taverna.ofertas = STATE.taverna.ofertas.filter((o) => o !== m);
    STATE.mercs.push(m);
    if (m.campeao && !STATE.campeoesObtidos.includes(m.campeao)) STATE.campeoesObtidos.push(m.campeao);
    if (STATE.time.length < tamanhoTime()) STATE.time.push(m.id);
    ajustarTime();
    toast(`${m.nome} entrou para a guilda!`, 'ok');
    const w = modalCom('ficha'); if (w && w.dados.modo === 'oferta') removerModal(w);
    aposMudanca();
  },
  'recrutar-pendente': () => {
    const m = STATE.campeaoPendente; if (!m) return;
    if (STATE.mercs.length >= limiteElenco()) { toast(avisoElencoCheio(), 'erro'); return; }
    STATE.campeaoPendente = null;
    receberCampeao(m);
    toast(`${m.nome} entrou para a guilda!`, 'ok');
    const w = modalCom('ficha'); if (w && w.dados.modo === 'pendente') removerModal(w);
    aposMudanca();
  },
  renovar: () => {
    const T = STATE.taverna; if (STATE.ouro < T.custo) return;
    STATE.ouro -= T.custo; const novo = T.custo + ECO.custoRenovar;
    renovarTaverna(true); STATE.taverna.custo = novo; aposMudanca();
  },
  comprar: (el) => {
    const it = STATE.taverna.loja.find((i) => i.id === +el.dataset.id); if (!it) return;
    if (STATE.inventario.length >= ECO.invMax) { toast('Inventário cheio.', 'erro'); return; }
    if (STATE.ouro < precoItem(it)) return;
    STATE.ouro -= precoItem(it); STATE.taverna.loja = STATE.taverna.loja.filter((i) => i !== it); STATE.inventario.push(it);
    somTocar('moeda'); toast(`${it.nome} foi para o inventário.`, 'ok'); aposMudanca();
  },
  'comprar-cons': (el) => { if (comprarConsumivel(el.dataset.id)) { somTocar('moeda'); toast(`${CONSUMIVEIS[el.dataset.id].nome} foi para a bolsa.`, 'ok'); aposMudanca(); } },
  'time-add': (el) => {
    const id = +el.dataset.id;

    if (STATE.time.length < tamanhoTime()) { STATE.time.push(id); ajustarTime(); aposMudanca(); return; }

  capitao: (el) => { STATE.capitao = +el.dataset.id; toast('Novo capitão definido.', 'ok'); aposMudanca(); },
  linha: (el) => { const m = mercPorId(+el.dataset.id); m.pos = posDe(el.dataset.v === 'frente' ? 0 : 2, posFileira(m.pos)); m.linha = linhaDePos(m.pos); aposMudanca(); },
  tatica: (el) => { mercPorId(+el.dataset.id).tatica = el.dataset.v; aposMudanca(); },

    STATE.ouro += valorVendaMerc(m);

  /* --- equipamentos, pergaminhos e relíquias --- */
